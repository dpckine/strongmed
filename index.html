/* ruta en miniatura (sin internet) */
function routePath(ruta, w, h, padd=10){ if(!ruta||ruta.length<2) return null; const lat0=ruta[0][0]*Math.PI/180, xs=ruta.map(p=>p[1]*Math.cos(lat0)), ys=ruta.map(p=>-p[0]);
  const mnx=Math.min(...xs), mxx=Math.max(...xs), mny=Math.min(...ys), mxy=Math.max(...ys), sc=Math.min((w-2*padd)/((mxx-mnx)||1e-9),(h-2*padd)/((mxy-mny)||1e-9)), ox=(w-(mxx-mnx)*sc)/2, oy=(h-(mxy-mny)*sc)/2;
  return xs.map((x,i)=>[ox+(x-mnx)*sc, oy+(ys[i]-mny)*sc]); }
function routeSvg(ruta, w=120, h=80){ const pp=routePath(ruta,w,h,8); if(!pp) return ''; return `<svg class="rthumb" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><polyline points="${pp.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pp[0][0]}" cy="${pp[0][1]}" r="3.5" fill="var(--green)"/><circle cx="${pp[pp.length-1][0]}" cy="${pp[pp.length-1][1]}" r="3.5" fill="var(--red)"/></svg>`; }
const gmapsUrl = d => { const r=d.ruta||[]; if(r.length<2) return '#'; const n=Math.min(8, r.length-2), wp=[]; for(let i=1;i<=n;i++) wp.push(r[Math.round(i*(r.length-1)/(n+1))].join(','));
  return `https://www.google.com/maps/dir/?api=1&origin=${r[0].join(',')}&destination=${r[r.length-1].join(',')}${wp.length?`&waypoints=${encodeURIComponent(wp.join('|'))}`:''}&travelmode=${d.tipoActividad==='Bicicleta'?'bicycling':'walking'}`; };
window.verRuta = async id => { const d=(me().diarios||[]).find(x=>String(x.id)===String(id)); if(!d) return;
  sheet(`<h2 class="disp h2">${esc(d.nombreSesion)}</h2><p class="muted sm">${fmtDate(d.fecha)} · ${d.distancia} km · ${d.duracion} min${d.ritmo?` · ${d.ritmo} min/km`:` · ${d.velocidad} km/h`}</p><div class="gpsmap" id="rt-map" style="margin-top:12px;height:300px">${routeSvg(d.ruta,320,300)}</div><div class="grid2" style="margin-top:12px"><a class="btn sec" href="${gmapsUrl(d)}" target="_blank" rel="noopener">${ic('pin','s')} Google Maps</a><button class="btn pri" onclick="closeSheet();compartir(${q(id)})">${ic('upload','s')} Compartir</button></div>`);
  if(await loadLeaflet()){ const el=$('#rt-map'); if(!el) return; el.innerHTML=''; const m=L.map(el,{zoomControl:false}); baseLayer(m); const pl=L.polyline(d.ruta,{color:'#ccff33',weight:5}).addTo(m); m.fitBounds(pl.getBounds(),{padding:[20,20]}); } };

async function storyBlob(p, d){
  const W=1080, H=1920, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  try{ await document.fonts.load('800 80px "Barlow Condensed"'); }catch(e){}
  const F=(s,wt=800)=>`${wt} ${s}px "Barlow Condensed", Impact, "Arial Narrow", sans-serif`, I=(s,wt=600)=>`${wt} ${s}px Inter, Arial, sans-serif`, ACC=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#ccff33';
  x.fillStyle='#08080a'; x.fillRect(0,0,W,H); const gr=x.createRadialGradient(W*.8,H*.15,50,W*.8,H*.15,900); gr.addColorStop(0,'rgba(204,255,51,.28)'); gr.addColorStop(1,'rgba(204,255,51,0)'); x.fillStyle=gr; x.fillRect(0,0,W,H);
  // logos: StrongMed × Kin At Home
  x.fillStyle='#fff'; x.font=F(64); x.fillText('STRONG',80,150); const sw=x.measureText('STRONG').width; x.fillStyle=ACC; x.fillText('MED',80+sw,150); const smw=sw+x.measureText('MED').width;
  x.fillStyle='#6b6b73'; x.font=F(48,700); x.fillText('×',80+smw+24,146); const kx=80+smw+76, ky=88, ks=72;
  x.fillStyle=ACC; x.beginPath(); x.roundRect ? x.roundRect(kx,ky,ks,ks,16) : x.rect(kx,ky,ks,ks); x.fill();
  x.save(); x.translate(kx,ky); x.scale(ks/400,ks/400); x.fillStyle='#1a1a1a'; x.fillRect(81,170,246,34); x.fillRect(187,70,34,233); x.translate(187,187); x.rotate(-Math.PI/4); x.fillRect(0,-117,34,120); x.restore();
  x.fillStyle='#fff'; x.font=F(40,800); x.fillText('KIN AT HOME',kx+ks+18,ky+34); x.fillStyle='#9a9aa3'; x.font=I(22,600); x.fillText('Kinesiología a domicilio',kx+ks+18,ky+64);
  x.fillStyle='#9a9aa3'; x.font=I(34,600); x.fillText(`${first(p.nombre)} · ${fmtLong(parseISO(toISO(d.fecha)))}`,80,H-80);
  x.fillStyle=ACC; const ttl=String(d.nombreSesion||'Entrenamiento').toUpperCase().slice(0,28); let fs=150; x.font=F(fs); while(x.measureText(ttl).width>W-160 && fs>60){ fs-=6; x.font=F(fs); } x.fillText(ttl, 80, 420);
  const stat=(lbl,v,u,cx,cy)=>{ x.fillStyle='#9a9aa3'; x.font=I(32,600); x.fillText(lbl.toUpperCase(),cx,cy); x.fillStyle='#fff'; x.font=F(120); x.fillText(v,cx,cy+120); if(u){ const vw=x.measureText(v).width; x.fillStyle='#9a9aa3'; x.font=F(52,700); x.fillText(u,cx+vw+12,cy+120); } };
  if(d.ruta && d.ruta.length>1){
    const box=[80,500,W-160,820], pp=routePath(d.ruta,box[2],box[3],30).map(([a,b])=>[a+box[0],b+box[1]]);
    x.lineJoin='round'; x.lineCap='round'; x.shadowColor=ACC; x.shadowBlur=30; x.strokeStyle=ACC; x.lineWidth=16; x.beginPath(); pp.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])); x.stroke(); x.shadowBlur=0;
    x.fillStyle='#3ddc84'; x.beginPath(); x.arc(pp[0][0],pp[0][1],18,0,7); x.fill(); x.fillStyle='#ff5a4f'; x.beginPath(); x.arc(pp[pp.length-1][0],pp[pp.length-1][1],18,0,7); x.fill();
    stat('Distancia', String(d.distancia), 'km', 80, 1400); stat('Tiempo', d.segundos?fmtClock(d.segundos):String(d.duracion), d.segundos?'':'min', 600, 1400);
    stat(d.ritmo?'Ritmo':'Velocidad', d.ritmo||String(d.velocidad), d.ritmo?'/km':'km/h', 80, 1600);
  } else {
    const ej=(d.ejercicios||[]).slice(0,6); let y=560; x.font=I(40,700);
    const num=v=>{ const n=parseFloat(String(v).replace(',','.')); return isFinite(n)&&n>0?n:null; };
    ej.forEach(e=>{ const kg=num(e.kilos??e.kg); x.fillStyle='#fff'; x.font=I(44,700); x.fillText(String(e.ejercicio).slice(0,30),80,y); x.fillStyle=ACC; x.font=F(54); x.fillText(`${e.series||''} × ${e.reps||''}${kg?` · ${kg} kg`:''}`,80,y+64); y+=150; });
    const vol=(d.ejercicios||[]).reduce((s,e)=>s+(e.sets||[]).reduce((a,t)=>a+(+t.kg||0)*(+t.reps||0),0),0), series=(d.ejercicios||[]).reduce((s,e)=>s+(+e.series||0),0);
    stat('Duración', String(d.duracion||'—'), 'min', 80, 1400); stat('Series', String(series||'—'), '', 600, 1400); if(vol) stat('Volumen', Math.round(vol).toLocaleString('es-CL'), 'kg', 80, 1600);

  return [...own, ...KIA_BASE].map(d=>({...d, st:new Set(kiaTok(d.t+' '+d.k)), wt:new Set(kiaTok(d.r))}));
}
function kiaScore(qt, d){ let s=0, strong=0; qt.forEach(w=>{ if(d.st.has(w)){ s+=3; strong++; } else if(d.wt.has(w)) s+=1; }); return {s, strong}; }
const KIA_MUS = [[/pecho|pector/, ['Pectorales']], [/glute|gluteo|poto/, ['Glúteos']], [/bicep/, ['Bíceps']], [/tricep/, ['Tríceps']], [/hombro|deltoid/, ['Deltoides']], [/espalda|dorsal/, ['Dorsal Ancho','Espalda alta']],
  [/abdom|core|abdominal/, ['Abdomen']], [/cuadri|muslo/, ['Cuádriceps']], [/isquio|femoral/, ['Isquiotibiales']], [/gemelo|pantorr|panto/, ['Pantorrillas / Gemelos']], [/lumbar/, ['Espinales / Lumbar']], [/antebraz/, ['Antebrazos']], [/trapecio/, ['Trapecio']], [/aductor/, ['Aductores']], [/pierna/, ['Cuádriceps','Glúteos','Isquiotibiales']]];
async function kiaAnswer(text){
  const f=kiaFold(text), qt=kiaTok(text);
  if(/^(hola|buenas|buenos|holi|hey)\b/.test(f) && qt.length<=1) return {r:'¡Hola! Soy KIN IA. Pregúntame sobre entrenamiento, series y repeticiones, descanso, cargas, cardio, pasos o ejercicios para un músculo.'};
  if(/ejercicio|rutina|trabajar|entrenar|fortalecer/.test(f)){ const m=KIA_MUS.find(([re])=>re.test(f));
    if(m){ await loadLib(); const ex=(S.lib||[]).filter(x=>m[1].includes(x.m)); if(ex.length){ const pick=ex.filter(x=>/barra|mancuerna|peso corporal|polea/i.test(x.q)).slice(0,6); const list=(pick.length?pick:ex).slice(0,6);
      return {r:`Algunos ejercicios para ${m[1].map(x=>x.toLowerCase()).join(', ')}:`, ex:list.map(x=>({i:x.i, n:x.n, q:x.q})), extra:'Prioriza primero los multiarticulares y luego los de aislamiento. Tu kinesiólogo puede armarte la rutina.'}; } } }
  if(!qt.length) return {r:KIA_NO, no:true};
  const best=kiaDocs().map(d=>({d, ...kiaScore(qt,d)})).filter(x=>x.strong>0).sort((a,b)=>(b.s-a.s) || (b.d.own?1:0)-(a.d.own?1:0));
  const need = qt.length<=2 ? 3 : Math.max(4, Math.ceil(qt.length*1.2));
  if(best.length && best[0].s>=need) return {r:best[0].d.r, t:best[0].d.t, kine:best[0].d.kine, own:best[0].d.own};
  // apuntes cargados por el equipo
  const notes=(S.faq||[]).filter(x=>x.tipo==='texto').flatMap(x=>String(x.respuesta||'').split(/\n+|(?<=[.!?])\s+/).map(sn=>({sn:sn.trim(), from:x.pregunta}))).filter(x=>x.sn.length>25);
  const hits=notes.map(n=>{ const tk=new Set(kiaTok(n.sn)); const c=qt.filter(w=>tk.has(w)).length; return {...n, c}; }).filter(n=>n.c>=Math.max(2, Math.ceil(qt.length*0.5))).sort((a,b)=>b.c-a.c);
  if(hits.length) return {r:hits.slice(0,2).map(h=>h.sn).join('\n'), t:`De los apuntes: ${hits[0].from}`, own:true};
  if(best.length && best[0].s>=3 && best[0].strong>=2) return {r:best[0].d.r, t:best[0].d.t, kine:best[0].d.kine};
  return {r:KIA_NO, no:true};
}
