<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060607">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StrongMed">
<title>StrongMed × Kin At Home</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --acc:#ccff33; --acc-ink:#0a0a0a;
  --bg:#060607; --card:#111114; --card2:#1a1a1f; --card3:#222228;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --tx:#f4f4f6; --mu:#8a8a93;
  --red:#ff5a4f; --orange:#ff9f2e; --yellow:#ffd23f; --green:#3ddc84; --blue:#5aa2ff; --pink:#ff6fae;
  --acc-tx:var(--acc); --acc-soft:color-mix(in srgb,var(--acc) 13%,transparent);
  --r:20px; --tabh:74px;
}
:root[data-theme="light"]{
  --bg:#f2f2ef; --card:#ffffff; --card2:#f3f3f0; --card3:#e9e9e5;
  --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.13);
  --tx:#111113; --mu:#6b6b72;
  --acc-tx:color-mix(in srgb,var(--acc) 48%,#000);
  --acc-soft:color-mix(in srgb,var(--acc) 22%,transparent);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:15px;line-height:1.42;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100dvh;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon.s{width:16px;height:16px}.icon.l{width:24px;height:24px}

/* type */
.disp{font-family:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;font-weight:800;text-transform:uppercase;line-height:.92;letter-spacing:.005em}
.mega{font-size:64px}.h1{font-size:40px}.h2{font-size:30px}.h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.acc-t{color:var(--acc-tx)}.muted{color:var(--mu)}.b{font-weight:700}
.sm{font-size:13px}.xs{font-size:12px}.center{text-align:center}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* layout */
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(var(--tabh) + 40px + env(safe-area-inset-bottom))}
.wrap.wide{max-width:1040px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.grid4{grid-template-columns:repeat(4,1fr)}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 2px}
.sec-t h2{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.tight{padding:12px}
.hero{background:var(--acc);color:var(--acc-ink);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero .eyebrow{color:currentColor;opacity:.62}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.18)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left}
.li+.li{border-top:1px solid var(--line)}
button.li:active{background:var(--card2)}
.ico{width:36px;height:36px;border-radius:11px;background:var(--acc-soft);color:var(--acc-tx);display:grid;place-items:center;flex:none}
.ico.blue{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.ico.orange{background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--orange)}
.ico.red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.chev{color:var(--mu)}
.empty{color:var(--mu);font-size:13px;text-align:center;padding:22px 10px}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--card2);font-size:13px;color:var(--mu)}
.note .icon{color:var(--blue);margin-top:1px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--mu);white-space:nowrap}
.badge.acc,.badge.entrenamiento{background:var(--acc-soft);color:var(--acc-tx)}
.badge.rehabilitacion{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.badge.mixto{background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--orange)}
.badge.red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.hero .badge{background:rgba(0,0,0,.12);color:inherit}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:14.5px;transition:transform .12s,opacity .12s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.sec{background:var(--card2);border:1px solid var(--line)}
.btn.dark{background:rgba(0,0,0,.86);color:var(--acc)}
.btn.ghost{color:var(--acc-tx)}
.btn.danger{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.btn.sm{height:36px;padding:0 13px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card2);color:var(--mu);flex:none}
.ibtn.red{color:var(--red)}

/* forms */
.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;font-size:15px;min-height:46px}
.inp:focus{border-color:var(--acc)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.45}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:0 0 6px 2px}
.field{display:block}
.seg{display:flex;background:var(--card2);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mu);text-align:center}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.25)}
:root[data-theme="light"] .seg button.on{background:#fff}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{height:34px;padding:0 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mu);white-space:nowrap}
.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=range]{width:100%;accent-color:var(--acc)}
.searchbox{position:relative}.searchbox .icon{position:absolute;left:14px;top:13px;color:var(--mu)}.searchbox .inp{padding-left:42px}

/* avatar */
.av{border-radius:50%;background:var(--card3) center/cover;display:grid;place-items:center;font-weight:800;color:var(--acc-tx);flex:none;border:1.5px solid var(--line2)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0;border-radius:14px;font-size:10.5px;color:var(--mu);font-weight:700;text-transform:uppercase}
.day b{font-size:16px;color:var(--tx);font-weight:700}
.day .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;color:var(--acc-ink)}
.day .dot .icon{width:12px;height:12px;stroke-width:3}
.day.done .dot{background:var(--acc);border-color:var(--acc)}
.day.today{background:var(--acc-soft)}
.day.future{opacity:.45}

/* ring */
.ring{position:relative;flex:none}.ring svg{width:100%;height:100%;display:block}
.ring .bg{stroke:var(--card3);fill:none}.ring .fg{stroke:var(--acc);fill:none;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring.blue .fg{stroke:var(--blue)}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring-in b{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800}
.ring-in small{font-size:10.5px;color:var(--mu);font-weight:600;margin-top:2px}

/* exercise list (plan) */
.exl{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.ex{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--card2)}
.hero .ex{background:rgba(0,0,0,.08)}
.cc{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--line2);display:grid;place-items:center;color:transparent;flex:none}
.cc .icon{width:14px;height:14px;stroke-width:3}
.cc.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.sr{font-size:13px;color:var(--mu);font-weight:600;white-space:nowrap}
.vid{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc-tx);flex:none}
.rt.done{opacity:.6}
.donebar{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green);font-weight:700;font-size:13.5px;margin-top:12px}

/* check-in scale */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{height:44px;border-radius:12px;background:var(--card2);font-weight:700;text-align:center;border-bottom:3px solid var(--c);transition:transform .1s}
.scale button.on{background:var(--c);color:#0a0a0a;transform:translateY(-1px)}
.scale-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mu);margin-top:5px}
.ci-sum{display:flex;gap:6px;flex-wrap:wrap}
.ci-sum span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:10px;background:var(--card2)}
.ci-sum i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c)}

/* workout */
.wo-head{position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(18px)}
.wo-time{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:800;color:var(--acc-tx);font-variant-numeric:tabular-nums}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 1fr 42px;gap:6px;align-items:center;margin-top:6px}
.setrow.head{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-align:center;margin-top:12px}
.setrow .sn{text-align:center;font-weight:800;color:var(--mu);font-size:13px}
.setrow input{height:42px;text-align:center;background:var(--card2);border:1px solid transparent;border-radius:11px;outline:none;font-weight:700;width:100%;min-width:0}
.setrow input:focus{border-color:var(--acc)}
.chk{width:42px;height:42px;border-radius:11px;background:var(--card2);display:grid;place-items:center;color:var(--mu)}
.setrow.done input{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.setrow.done .chk{background:var(--acc);color:var(--acc-ink)}
.setrow.done .sn{color:var(--acc-tx)}
.restbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + 8px + env(safe-area-inset-bottom));z-index:35;padding:0 12px}
.rb-in{max-width:536px;margin:0 auto;background:var(--card3);border:1px solid var(--line2);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.4);position:relative;overflow:hidden}
.rb-t{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.rb-fill{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);transition:width 1s linear}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button{height:44px;border-radius:12px;background:var(--card2);font-weight:800;text-align:center}
.rpe button.on{background:var(--acc);color:var(--acc-ink)}

/* progress */
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:800;line-height:1}
.stat span{font-size:12px;color:var(--mu);font-weight:600}
.stat.acc b{color:var(--acc-tx)}
button.stat{text-align:left}
.bar{height:8px;border-radius:99px;background:var(--card3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat .h{aspect-ratio:1;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--mu)}
.heat .h.on{background:var(--acc);color:var(--acc-ink)}
.heat .h.today{outline:1.5px solid var(--tx)}
.heat .h.fut{opacity:.3}
.heat .hd{font-size:10px;font-weight:700;color:var(--mu);text-align:center;text-transform:uppercase}
.chart{position:relative;height:210px}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line2);border-radius:2px}
.tl-i{position:relative;padding:0 0 16px}
.tl-i:before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.tl-i.blue:before{background:var(--blue)}
.tl-i .body{font-size:13.5px;color:var(--tx);margin-top:4px;line-height:1.5}
.tl-i .body strong{font-weight:700}

/* chat */
.wrap.chatmode{padding-bottom:0}
.chat{display:flex;flex-direction:column;height:calc(100dvh - var(--tabh) - 30px - env(safe-area-inset-bottom) - env(safe-area-inset-top));min-height:360px}
.chat-h{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.chat-m{flex:1;overflow-y:auto;padding:14px 2px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:80%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.4;position:relative;word-wrap:break-word;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--card2);border-bottom-left-radius:6px}
.bub time{display:block;font-size:10.5px;opacity:.55;margin-top:3px;text-align:right}
.bub .del{display:none;position:absolute;left:-34px;top:50%;transform:translateY(-50%);color:var(--red)}
.bub.sel .del{display:block}
.chat-f{display:flex;gap:8px;padding:10px 0 12px;border-top:1px solid var(--line)}
.chat-f .inp{border-radius:999px}
.chat-f .btn{width:48px;padding:0;border-radius:50%}
.msgs{display:grid;gap:14px}
@media(min-width:900px){.msgs{grid-template-columns:320px 1fr}.msgs .mlist{display:block!important}.msgs .mpane{display:block!important}}
.msgs.has .mlist{display:none}.msgs:not(.has) .mpane{display:none}
.chat-it.on{background:var(--acc-soft)}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;height:calc(var(--tabh) + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding:9px 4px env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--mu);text-align:center}
.tab .icon{width:23px;height:23px}
.tab.on{color:var(--tx)}.tab.on .icon{color:var(--acc-tx)}
.fabc{width:60px;height:60px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin-top:-28px;border:5px solid var(--bg);box-shadow:0 8px 28px color-mix(in srgb,var(--acc) 30%,transparent);position:relative}
.tab.fab .icon{color:var(--acc-ink)!important;width:26px;height:26px}
.live{position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--bg);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}

/* pro sidebar */
.side{display:none}
@media(min-width:900px){
  .pro .side{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:248px;padding:24px 16px;border-right:1px solid var(--line);background:var(--bg);z-index:20}
  .pro .wrap{margin-left:248px;margin-right:0;padding-left:32px;padding-right:32px;padding-bottom:40px;max-width:1100px}
  .pro .tabbar{display:none}
  .pro .wrap.chatmode .chat{height:calc(100dvh - 60px)}
  .pro .restbar{bottom:20px}
}
.side .nav{display:flex;flex-direction:column;gap:2px;margin-top:26px}
.side .nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;color:var(--mu)}
.side .nav button.on{background:var(--card2);color:var(--tx)}.side .nav button.on .icon{color:var(--acc-tx)}

/* header */
.top{margin-bottom:6px}
.logo-m{width:40px;height:40px;border-radius:12px;background:#111;border:1px solid var(--line2);display:grid;place-items:center;overflow:hidden;flex:none}
.logo-m img{width:100%;height:100%;object-fit:contain;padding:3px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--acc-tx);font-weight:600;font-size:14px;margin-bottom:6px}

/* login */
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 18px;position:relative;overflow:hidden}
.glow{position:absolute;inset:-20% -20% auto;height:70%;background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 22%,transparent),transparent);pointer-events:none}
.login-in{width:100%;max-width:400px;min-width:0;position:relative;display:flex;flex-direction:column;gap:16px}
.login .mega{font-size:clamp(44px,14vw,82px);white-space:nowrap}
.pin{letter-spacing:.6em;text-align:center;font-weight:800;font-size:20px}

/* sheet & toast */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet-bg.in{opacity:1}
.sheet{width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;background:var(--card);border:1px solid var(--line2);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .25s cubic-bezier(.2,.9,.3,1)}
.sheet-bg.in .sheet{transform:none}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:26px}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 14px}

/* ================= MEDIDOR DE USO DE FIREBASE =================
   Cuenta las lecturas, escrituras y borrados que hace la app y los suma por día (hora del Pacífico,
   que es cuando Firebase renueva la cuota gratuita) en la colección "uso" de Firebase StrongMed. */
const CUOTA = {r:50000, w:20000, d:20000};
const diaPT = (d=new Date()) => new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles', year:'numeric', month:'2-digit', day:'2-digit'}).format(d);
function msHastaRenovar(){ const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles', hour:'numeric', minute:'numeric', second:'numeric', hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return ((24-(+p.hour))*3600 - (+p.minute)*60 - (+p.second))*1000; }
const USO = {pend:{}, hoy:{}};
function dbName(ref){ const db=ref && (ref.firestore || ref.db || (ref.parent && ref.parent.firestore)); return db===S.dbs.kah ? 'kah' : 'sm'; }
function usoAdd(proj, k, n){ if(!n) return; const P=USO.pend[proj]=USO.pend[proj]||{}; P[k]=(P[k]||0)+n; const H=USO.hoy[proj]=USO.hoy[proj]||{}; H[k]=(H[k]||0)+n; }
function medirFB(F){
  const W={...F};
  W.getDocs = async q => { const s=await F.getDocs(q); if(!(s.metadata&&s.metadata.fromCache)) usoAdd(dbName(q),'r',Math.max(1,s.size||0)); return s; };
  if(F.getDoc) W.getDoc = async r => { const s=await F.getDoc(r); if(!(s.metadata&&s.metadata.fromCache)) usoAdd(dbName(r),'r',1); return s; };
  W.setDoc = (r, ...a) => { usoAdd(dbName(r),'w',1); return F.setDoc(r, ...a); };
  W.deleteDoc = r => { usoAdd(dbName(r),'d',1); return F.deleteDoc(r); };
  if(F.writeBatch) W.writeBatch = db => { const b=F.writeBatch(db), set=b.set.bind(b); b.set=(r,...a)=>{ usoAdd(dbName(r),'w',1); return set(r,...a); }; return b; };
  W.onSnapshot = (r, cb, ...a) => F.onSnapshot(r, s=>{ if(!(s.metadata&&s.metadata.fromCache)){ const n = typeof s.docChanges==='function' ? s.docChanges().length : (s.size!=null ? s.size : 1); usoAdd(dbName(r),'r',Math.max(1,n)); } cb(s); }, ...a);
  return W;
}
async function usoFlush(){ if(!S.fb || !Object.keys(USO.pend).length) return; const pend=USO.pend; USO.pend={}; const F=S.fb, inc=F.increment||(n=>n), data={};
  Object.entries(pend).forEach(([pj,o])=>Object.entries(o).forEach(([k,n])=>{ data[`${pj}_${k}`]=inc(n); })); data.sm_w = inc(((pend.sm||{}).w||0)+1); data.actualizado=Date.now();
  try{ await F.setDoc(F.doc(S.dbs.sm,'uso',diaPT()), data, {merge:true}); }catch(e){ console.warn('uso', e); } }
setInterval(usoFlush, 90000);

  if(out.length){ S.all=out; return true; }
  try{ const s=await F.getDoc(F.doc(S.dbs.sm,'ajustes','base')); if(s.exists() && s.data().rutN){ S.all=[]; return true; } }catch(e){}
  const ok=await loadDB(['sm','kah']); if(ok) S.all=S.all.filter(p=>normRut(p.rut)===r); return ok;

const isTraining = d => (d.ejercicios && d.ejercicios.length) || d.nombreSesion || d.tipoActividad;
const sessions = p => (p.diarios||[]).filter(isTraining);
const trainedSet = p => new Set(sessions(p).map(d=>toISO(d.fecha)).filter(Boolean));
function weekStart(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function weekStreak(p){ const set=trainedSet(p); const has=w=>{ for(let i=0;i<7;i++){ const d=new Date(w); d.setDate(d.getDate()+i); if(set.has(iso(d))) return true; } return false; };
  let ws=weekStart(new Date()), n=0; if(!has(ws)) ws.setDate(ws.getDate()-7); while(has(ws) && n<200){ n++; ws.setDate(ws.getDate()-7); } return n; }
const sess30 = p => sessions(p).filter(d=>daysAgo(toISO(d.fecha))<30).length;
const sessWeek = p => { const ws=iso(weekStart(new Date())); return sessions(p).filter(d=>toISO(d.fecha)>=ws).length; };
const meta = p => +p.metaSemanal || 3;
const adherence = p => Math.min(100, Math.round(sess30(p) / (meta(p)*30/7) * 100));
const rpeAvg = p => { const r=sessions(p).map(d=>+d.rpe).filter(Boolean); return r.length ? (r.reduce((a,b)=>a+b,0)/r.length).toFixed(1) : '—'; };

const rehabPlan = p => +p.sesionesPlan || 0;

function lastActivity(p){ const ds=[...(p.diarios||[]).map(d=>toISO(d.fecha)), ...(p.sesionesRehab||[]).map(s=>toISO(s.fecha)), ...(p.checkins||[]).map(c=>toISO(c.fecha)), ...(p.animo||[]).map(c=>c.fecha)].filter(Boolean).sort(); return ds.pop()||''; }

  for(const d of ds){ const e=(d.ejercicios||[]).find(x=>String(x.ejercicio).toLowerCase()===n); if(e) return `${e.kilos||e.kg||0} kg × ${e.reps||'-'}`; } return ''; }
const citaTs = c => { const s=toISO(c.fecha); if(!s) return 0; const d=parseISO(s); const [h,m]=String(c.hora||(c.bloque==='PM'?'15:00':'09:00')).split(':').map(Number); d.setHours(h||0,m||0); return d.getTime(); };

function alertsOf(p){

/* ================= SEGURIDAD: Firebase Authentication =================
   Personas:      correo interno <rut>.<pin>@p.strongmed.app   → las reglas solo dejan leer SU ficha, sus mensajes y sus citas.
   Profesionales: correo interno <usuario>.<huella>@pro.strongmed.app → las reglas revisan su acceso en la colección "acceso".
   Si Authentication aún no está activado en Firebase, la app sigue funcionando como antes (modo abierto). */
function sha256(str){ // implementación compacta (funciona también abriendo el archivo desde el computador)
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=new TextEncoder().encode(str), l=b.length, n=((l+9+63)>>6)<<6, m=new Uint8Array(n); m.set(b); m[l]=0x80; const dv=new DataView(m.buffer); dv.setUint32(n-4, l*8>>>0); dv.setUint32(n-8, Math.floor(l/0x20000000));
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]; const W=new Array(64), r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<n;o+=64){ for(let t=0;t<16;t++) W[t]=dv.getUint32(o+t*4); for(let t=16;t<64;t++){ const s0=r(W[t-15],7)^r(W[t-15],18)^(W[t-15]>>>3), s1=r(W[t-2],17)^r(W[t-2],19)^(W[t-2]>>>10); W[t]=(W[t-16]+s0+W[t-7]+s1)|0; }
    let [a,b2,c,d,e,f,g,h]=H; for(let t=0;t<64;t++){ const S1=r(e,6)^r(e,11)^r(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[t]+W[t])|0, S0=r(a,2)^r(a,13)^r(a,22), mj=(a&b2)^(a&c)^(b2&c), t2=(S0+mj)|0; h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b2; b2=a; a=(t1+t2)|0; }
    H=H.map((v,i)=>(v+[a,b2,c,d,e,f,g,h][i])|0); }
  return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join(''); }
const hA = (u,c) => sha256(`A|${u}|${c}`), hB = (u,c) => sha256(`B|${u}|${c}`).slice(0,20);

const AUTH_MAL = 'MAL';
async function entrar(auth, email, pass){ // inicia sesión o crea la cuenta la primera vez. Devuelve true, AUTH_MAL o null (Authentication no activado)
  if(!S.AU || !auth) return null; const AU=S.AU;
  if(auth.currentUser && auth.currentUser.email===email) return true;
  try{ await AU.signInWithEmailAndPassword(auth, email, pass); return true; }
  catch(e){ const c=e.code||'';
    if(/operation-not-allowed|configuration-not-found|admin-restricted/.test(c)){ S.authOff=true; return null; }
    if(/network|unavailable|internal/.test(c)) return null;
    if(/invalid-credential|user-not-found|invalid-login|wrong-password|invalid-email/.test(c)){
      try{ await AU.createUserWithEmailAndPassword(auth, email, pass); return true; }
      catch(e2){ const c2=e2.code||''; if(/email-already-in-use/.test(c2)) return AUTH_MAL; if(/operation-not-allowed|configuration-not-found|admin-restricted/.test(c2)){ S.authOff=true; return null; } if(/weak-password/.test(c2)) return AUTH_MAL; console.warn(e2); return null; } }
    if(/too-many-requests/.test(c)){ toast('Demasiados intentos. Espera unos minutos.','err'); return AUTH_MAL; }
    console.warn(e); return null; } }
async function salirAuth(){ if(!S.AU || !S.auth) return; for(const a of Object.values(S.auth)){ try{ if(a.currentUser) await S.AU.signOut(a); }catch(e){} } }

async function registrarRut(org, rut, pin, esNuevo){ const F=S.fb, db=S.dbs[org||'sm'], r=normRut(rut), p=String(pin||'');
  if(!F.writeBatch) return true;
  try{ const b=F.writeBatch(db); b.set(F.doc(db,'ruts',r), {org:org||'sm', t:Date.now()}, esNuevo?{}:{merge:true}); b.set(F.doc(db,'pines',r), {pin:p}, esNuevo?{}:{merge:true}); await fsWrite(b.commit()); return true; }
  catch(e){ console.warn('ruts', e); return false; } }

const orgsDe = org => org==='all' ? ['sm','kah'] : [org||'sm'];
async function entrarPro(usuario, clave){
  const u=proUser(usuario), h=hB(u,clave), em=proEmail(u,h);
  const r=await entrar(S.auth?.sm, em, clave); if(r===AUTH_MAL) return null;
  let acc=await accesoDe('sm', u);
  if(acc===null) return null;                                           // las reglas no lo dejan: contraseña incorrecta
  if(acc){ if(acc.h!==h || acc.activo===false) return null; }
  else { const b=BUILTIN_PROS.find(x=>x.usuario===u && x.hA===hA(u,clave));
    if(b){ acc={id:b.id, usuario:u, nombre:b.nombre, org:b.org, rol:b.rol, esp:b.esp||'', builtin:true, h, activo:true}; await guardarAcceso('sm', u, acc); }
    else { await loadPros(); const old=S.pros.find(x=>proUser(x.usuario)===u && x.clave && x.clave===clave && x.activo!==false); if(!old) return null;  // cuenta creada antes de la seguridad
      acc={id:old.id, usuario:u, nombre:old.nombre, org:old.org||'sm', rol:old.rol||'pro', esp:old.esp||'', h, activo:true}; await guardarAcceso('sm', u, acc); } }
  if(orgsDe(acc.org).includes('kah')){ const r2=await entrar(S.auth?.kah, em, clave); if(r2===true){ const a2=await accesoDe('kah', u); if(a2===false) await guardarAcceso('kah', u, acc); } }
  return acc; }
async function borrarClavesAntiguas(){ if(!isAdmin()) return; for(const p of S.pros.filter(x=>x.clave)){
  const acc={id:p.id, usuario:proUser(p.usuario), nombre:p.nombre, org:p.org||'sm', rol:p.rol||'pro', esp:p.esp||'', h:hB(proUser(p.usuario), p.clave), activo:p.activo!==false};
  for(const o of ['sm',...(orgsDe(acc.org).includes('kah')?['kah']:[])]) await guardarAcceso(o, acc.usuario, acc); const q={...p}; delete q.clave; await fsSet('profesionales', p.id, q); } }

/* live updates for the person (alertas al instante) */
function watchMe(){
  if(S.meUnsub){ try{S.meUnsub()}catch(e){} S.meUnsub=null; }
  const p=me(); if(!p || !S.fb) return;
  try{ S.meUnsub = S.fb.onSnapshot(S.fb.doc(S.dbs[p.org||'sm'],'evaluaciones',String(p.id)), snap=>{
    if(!snap.exists()) return; const x=snap.data(); x.org=x.org||p.org;
    const i=S.all.findIndex(y=>y.id===x.id && y.org===x.org); const before=i>-1?JSON.stringify(S.all[i]):''; if(i>-1) S.all[i]=x; else S.all.push(x);
    if(before && before!==JSON.stringify(x)){ notifyNew(true); softRender(); } }); }catch(e){ console.warn(e); }
}
function softRender(){ const a=document.activeElement; if($('#sheet') || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) || (S.role==='pat' && ((S.patTab==='entrenar' && S.workout) || S.patTab==='gps'))) return; keepScroll(render); }
document.addEventListener('visibilitychange', async ()=>{ if(document.visibilityState!=='visible' || !S.role) return;
  const now=Date.now(); if(now-(S._lastSync||0) < 300000) return; S._lastSync=now;   // máximo cada 5 minutos (ahorra lecturas)
  if(S.role==='pat'){ const p=me(); if(p){ await loadPersona(p.rut); watchMe(); notifyNew(true); softRender(); } }
  else if(S.role==='pro' && !$('#sheet')){ await loadDB(); softRender(); } });
function notifyNew(withToast){
  const p=me(); if(!p) return; const key='sm_seen_'+keyOf(p); let seen; try{ seen=new Set(JSON.parse(localStorage.getItem(key))||[]); }catch(e){ seen=new Set(); }
  const fresh=unreadAvisos(p).filter(a=>!seen.has(String(a.id)));
  const soon=proximasCitas(p).filter(c=>c.estado==='confirmada' && citaTs(c)-Date.now()<24*3600e3 && !seen.has('c'+c.id));
  fresh.forEach(a=>{ seen.add(String(a.id)); if(withToast) toast(a.texto); sysNotify('StrongMed', a.texto); });
  soon.forEach(c=>{ seen.add('c'+c.id); sysNotify('Recordatorio de sesión', `${c.tipo||'Sesión'} ${rel(toISO(c.fecha))} a las ${c.hora} · ${c.lugar}`); });
  try{ localStorage.setItem(key, JSON.stringify([...seen].slice(-200))); }catch(e){}
}
function sysNotify(title, body){ try{ if('Notification' in window && Notification.permission==='granted') new Notification(title,{body, icon:LOGO}); }catch(e){} }

function shellPat(){
  const p=me(); if(!p){ S.role=null; return vLogin(); }
  const per=perfilOf(p), pend=isPending(p), rehab=!pend && per==='rehabilitacion', oral=soloOral(p);
  const views={hoy:vHoy, plan:vPlan, entrenar:vEntrenar, progreso:vProgreso, chat:vChatPat, perfil:vPerfil, agenda:vAgendaPat, faq:vKinIA, ficha:vAnamnesis, biblioteca:()=>vLib(), gps:vGps, oral:vTratamiento};
  if(oral){ views.hoy = pend ? vHoyPend : vHoyOral; views.plan = vTratamiento; if(!['hoy','plan','agenda','chat','perfil','oral'].includes(S.patTab)) S.patTab='hoy'; if(pend && S.patTab==='plan') S.patTab='hoy'; }
  if(pend && ['plan','entrenar','gps'].includes(S.patTab)) S.patTab='hoy';
  const body=(views[S.patTab]||vHoy)(p);
  const tabs = oral ? (pend ? [['agenda','cal','Agenda'],['hoy','home','Hoy'],['chat','chat','Mensajes']] : [['agenda','cal','Agenda'],['plan','tooth','Tratamiento'],['hoy','home','Hoy'],['chat','chat','Mensajes']])
    : pend ? [['agenda','cal','Agenda'],['ficha','clip','Mi ficha'],['hoy','home','Hoy'],['progreso','steps','Pasos'],['chat','chat','Mensajes']]
    : rehab ? [['agenda','cal','Agenda'],['plan','clip','Mi plan'],['hoy','home','Hoy'],['progreso','chart','Progreso'],['chat','chat','Mensajes']]
    : [['entrenar','dumbbell','Entrenar'],['plan','clip','Plan'],['hoy','home','Hoy'],['progreso','chart','Progreso'],['chat','chat','Mensajes']];
  return `<div class="shell pat"><main class="wrap ${S.patTab==='chat'?'chatmode':''} fade">${body}</main>
  <div id="restbar" class="restbar hidden"></div>
  <nav class="tabbar">${tabs.map(([k,i,l])=> k==='hoy'
    ? `<button class="tab fab ${S.patTab===k?'on':''}" onclick="go('hoy')"><span class="fabc">${ic(i)}${unreadAvisos(p).length?'<i class="live"></i>':''}</span><span>${l}</span></button>`
    : `<button class="tab ${S.patTab===k?'on':''}" onclick="go('${k}')">${ic(i)}${k==='entrenar'&&S.workout?'<i class="live" style="position:relative;top:-28px;right:-12px;margin-bottom:-12px"></i>':''}<span>${l}</span></button>`).join('')}</nav></div>`;
}

function weekStrip(p, rehab=false){ const set=rehab ? new Set([...(p.sesionesRehab||[]).map(s=>toISO(s.fecha)), ...(p.citas||[]).filter(c=>c.estado==='realizada').map(c=>toISO(c.fecha))]) : trainedSet(p);
  const up=new Set((p.citas||[]).filter(c=>c.estado==='confirmada').map(c=>toISO(c.fecha))), ws=weekStart(new Date()), td=todayISO(); let h='';
  for(let i=0;i<7;i++){ const d=new Date(ws); d.setDate(d.getDate()+i); const s=iso(d), done=set.has(s), cita=up.has(s)&&!done;
    h+=`<div class="day ${done?'done':''} ${s===td?'today':''} ${s>td&&!cita?'future':''}"><span>${DOW[d.getDay()].slice(0,2)}</span><b>${d.getDate()}</b><span class="dot" ${cita?'style="border-color:var(--blue);background:color-mix(in srgb,var(--blue) 25%,transparent)"':''}>${done?ic('check'):cita?`<i style="width:6px;height:6px;border-radius:50%;background:var(--blue)"></i>`:''}</span></div>`; }
  const n=rehab ? [...set].filter(s=>s>=iso(ws)).length : sessWeek(p);
  return `<section class="card tight"><div class="row between" style="padding:2px 4px 8px"><span class="eyebrow">Esta semana</span><span class="xs muted b">${rehab?`${n} sesiones · ● próxima hora`:`${n} de ${meta(p)} sesiones`}</span></div><div class="week">${h}</div></section>`; }

function heatmap(p){ const set=trainedSet(p), td=todayISO(); const start=weekStart(new Date()); start.setDate(start.getDate()-28);
  let h=['L','M','M','J','V','S','D'].map(d=>`<span class="hd">${d}</span>`).join('');
  for(let i=0;i<35;i++){ const d=new Date(start); d.setDate(d.getDate()+i); const s=iso(d); h+=`<span class="h ${set.has(s)?'on':''} ${s===td?'today':''} ${s>td?'fut':''}">${d.getDate()}</span>`; }
  return `<div class="heat">${h}</div>`; }

  S.after.push(()=>{ if(sel.length) mkChart('c-rm1','line', dates.map(fmtShort), sel.map(n=>{ const ci=names.indexOf(n)%5; return {label:n, data:dates.map(f=>{ const v=log.filter(r=>r.ejercicio===n&&r.fecha===f).map(r=>r.rm); return v.length?Math.max(...v):null; }), borderColor:cssv(RM_PAL[ci]), backgroundColor:cssv(RM_PAL[ci]), tension:.3, borderWidth:2.5, pointRadius:4, spanGaps:true}; }), {title:{display:true,text:'kg',color:cssv('--mu')}}); });

window.rmToggle = (k,n) => { const key='rm_'+k; const s=new Set(S[key]||[]); if(s.has(n)) s.delete(n); else s.add(n); S[key]=[...s]; keepScroll(render); };

  S.chatUnsub=S.fb.onSnapshot(Q, snap=>{ const a=[]; snap.forEach(d=>a.push({id:d.id, ...d.data()})); renderMsgs(a, p); }, err=>{ console.error(err); toast('No se pudo cargar el chat','err'); }); }

    return `${sep}<div class="bub ${mine?'me':'them'}" onclick="this.classList.toggle('sel')">${body}<time>${m.senderName&&!mine?esc(m.senderName)+' · ':''}${pad(d.getHours())}:${pad(d.getMinutes())}</time>${mine?`<button class="del" onclick="event.stopPropagation();delMsg(${q(keyOf(p))},${q(m.id)})" aria-label="Borrar">${ic('trash','s')}</button>`:''}</div>`; }).join('');

const RECO_MUS = {'Pecho':['Pectorales'], 'Espalda':['Dorsal Ancho','Espalda alta','Trapecio'], 'Hombros':['Deltoides'], 'Bíceps':['Bíceps'], 'Tríceps':['Tríceps'], 'Cuádriceps':['Cuádriceps'],

const RECO_EQ = {'Peso corporal':['Peso Corporal','Con Peso Adicional','Asistido'], 'Mancuernas':['Mancuernas'], 'Barra':['Barra','Barra Z','Barra olímpica','Barra Hexagonal'], 'Polea':['Polea'],
  'Máquina':['Máquina de Palanca','Máquina Smith','Máquina Hammer','Trineo de Empuje'], 'Banda elástica':['Banda Elástica'], 'Kettlebell':['Kettlebell / Pesa Rusa'], 'Balones':['Balón Suizo / Fitball','Balón Medicinal','Balón Bosu']};
const RECO_OBJ = {'Hipertrofia':{s:3,r:'10',i:'2',d:'90s'}, 'Fuerza':{s:4,r:'5',i:'2',d:'180s'}, 'Resistencia':{s:2,r:'15',i:'3',d:'60s'}, 'Rehabilitación':{s:3,r:'12',i:'3',d:'60s'}};
const RECO_BASE = /press|sentadilla|remo|peso muerto|dominada|estocada|zancada|hip thrust|empuje de cadera|jalon|fondos|puente|prensa|subida|swing|flexion de brazos|buenos dias|curl|extension|elevacion|plancha|crunch|abdominal|face pull|aperturas/;
const RECO_MULTI = /press|sentadilla|remo|peso muerto|dominada|estocada|zancada|hip thrust|empuje de cadera|jalon|fondos|prensa|subida|swing|flexion de brazos|buenos dias/;
const RECO_NO = /estiramiento|stretch|masaje|rodillo|foam|liberacion/;
function recoInit(){ S.reco=S.reco||{mus:[], eq:[], obj:'Hipertrofia', n:2, picks:[]}; return S.reco; }
const RECO_CLASIC = {'Pecho':['^press de banca','^press inclinado','^aperturas con mancuernas|^aperturas en polea|^aperturas de pie','^flexiones|^pecho fondos$'],
  'Espalda':['^dominadas$|^dominadas \\(agarre neutro\\)','^jalon en polea|^jalon al pecho|^jalon frontal','^remo','^pullover con barra|^pullover en maquina'],
  'Hombros':['^press militar|^press de hombros|^arnold press','^elevaciones laterales','^deltoides posterior|^rear elevaciones laterales','^remo al menton'],
  'Bíceps':['^curl de biceps|^curl con barra|^curl con mancuernas|^curl','^curl martillo|martillo','^curl concentrado|predicador|scott'],
  'Tríceps':['press frances|extension de triceps','^fondos|^triceps fondos|fondos en banco','^extension.*polea|press agarre cerrado'],
  'Cuádriceps':['^sentadilla profunda con|^sentadilla frontal con|^sentadilla con|^sentadilla goblet','^prensa','^pierna extension','^sentadilla dividida|^estocada|^subida al cajon'],
  'Isquiotibiales':['^peso muerto rumano|piernas rigidas','^pierna curl|^curl a una pierna|^femoral','^buenos dias','gluteo-ham'],
  'Glúteos':['hip thrust|empuje de cadera|^puente de gluteo','^peso muerto rumano','^estocada|^subida al cajon','^sentadilla profunda con|^peso muerto sumo'],
  'Pantorrillas':['elevacion de talones|elevaciones de talones|^talones','talon'],
  'Core':['^plancha','^crunch|^abdominal','dead bug|bicho','pallof|rueda abdominal'],
  'Lumbar':['hiperextension|extension lumbar|superman','^buenos dias'], 'Antebrazos':['^curl de muneca|^muneca','^farmers|granjero'], 'Aductores / abductores':['aductor|abductor','lateral estocada|^estocada lateral']};
const RECO_ES = /^(press|sentadilla|peso|puente|estocada|subida|buenos|remo|jalon|dominadas|dominada|elevaciones|elevacion|aperturas|curl|extension|prensa|femoral|fondos|flexiones|pullover|plancha|abdominal|crunch|empuje|hip|deltoides|arnold|pierna)\b/;
function recoCands(mus){ const R=S.reco, ms=RECO_MUS[mus]||[], eqs=R.eq.flatMap(e=>RECO_EQ[e]||[]), okEq=x=>!eqs.length || eqs.includes(x.q), lib=(S.lib||[]).filter(x=>okEq(x) && !RECO_NO.test(fold(x.n)));
  const out=[], seen=new Set(), add=x=>{ if(!seen.has(x.i)){ seen.add(x.i); out.push(x); } };
  (RECO_CLASIC[mus]||[]).forEach(pat=>{ const re=new RegExp(pat); const hits=lib.filter(x=>re.test(fold(x.n)) && !/ v\. ?\d/.test(x.n)).sort((a,b)=>a.n.length-b.n.length); if(hits.length) add(hits[Math.floor(Math.random()*Math.min(3,hits.length))]); });
  lib.filter(x=>ms.includes(x.m)).map(x=>{ const f=fold(x.n); let sc=0; if(RECO_ES.test(f)) sc+=3; else sc-=3; if(RECO_MULTI.test(f)) sc+=2; if(f.length>34) sc-=1.5; if(/ v\. ?\d|\(male\)|pov/.test(f)) sc-=3; if(R.obj==='Rehabilitación' && /banda|peso corporal|puente|isometr/.test(f+' '+fold(x.q))) sc+=2; return {x, sc:sc+Math.random()}; })
    .sort((a,b)=>b.sc-a.sc).forEach(o=>add(o.x));
  return out; }
function recoPanel(rowsId, full){ const R=recoInit();
  return `<details class="card reco" ${R.open?'open':''} ontoggle="S.reco.open=this.open"><summary class="row between"><span class="b">${ic('target','s')} Armar por músculos</span><span class="xs muted">Recomendación automática</span></summary><div class="stack" id="reco-in" style="margin-top:12px">${recoBody(rowsId, full)}</div></details>`; }
function recoBody(rowsId, full){ const R=S.reco, a=JSON.stringify(rowsId), chip=(arr,key,multi)=>`<div class="pills" style="flex-wrap:wrap">${arr.map(v=>{ const on=multi?R[key].includes(v):R[key]===v; return `<button type="button" class="pill ${on?'on':''}" onclick='recoSet(${JSON.stringify(key)},${JSON.stringify(v)},${multi},${esc(a)},${full})'>${esc(v)}</button>`; }).join('')}</div>`;
  if(!S.lib) { loadLib().then(()=>{ const el=$('#reco-in'); if(el) el.innerHTML=recoBody(rowsId, full); }); return '<div class="xs muted">Cargando biblioteca de ejercicios…</div>'; }
  if(!S.lib.length) return '<div class="xs muted">La biblioteca de ejercicios no está disponible.</div>';
  return `<div><div class="lbl">¿Qué músculos quieres entrenar?</div>${chip(Object.keys(RECO_MUS),'mus',true)}</div>
  <div><div class="lbl">Equipamiento disponible <span class="muted">(vacío = cualquiera)</span></div>${chip(Object.keys(RECO_EQ),'eq',true)}</div>
  <div class="grid2"><div><div class="lbl">Objetivo</div>${chip(Object.keys(RECO_OBJ),'obj',false)}</div><div><div class="lbl">Ejercicios por músculo</div>${chip([1,2,3],'n',false)}</div></div>
  <button type="button" class="btn sec block" onclick='recoGen(${esc(a)},${full})'>${ic('spark','s')} Recomendar ejercicios</button>
  ${R.picks.length?`<div class="list">${R.picks.map((pk,i)=>{ const x=S.lib.find(e=>e.i===pk.i); if(!x) return ''; return `<div class="li"><button type="button" class="thumb" style="background-image:url('${media(x.img)}')" onclick="verEj(${q(x.i)})" aria-label="Ver técnica"></button><div class="grow"><div class="b sm">${esc(x.n)}</div><div class="xs muted">${esc(pk.mus)} · ${esc(x.q)}</div></div><button type="button" class="ibtn" onclick='recoSwap(${i},${esc(a)},${full})' aria-label="Cambiar">${ic('swap','s')}</button><button type="button" class="ibtn red" onclick='recoDel(${i},${esc(a)},${full})' aria-label="Quitar">${ic('x','s')}</button></div>`; }).join('')}</div>
  <div class="xs muted">Toca la imagen para ver la explicación y la animación. Usa ⟳ para cambiar un ejercicio.</div>
  <button type="button" class="btn pri block" onclick='recoUsar(${esc(a)},${full})'>${ic('plus','s')} Agregar ${R.picks.length} ejercicios a la rutina</button>`:''}`; }
const recoRefresh = (rowsId, full) => { const el=$('#reco-in'); if(el) el.innerHTML=recoBody(rowsId, full); };
window.recoSet = (k, v, multi, rowsId, full) => { const R=S.reco; if(multi){ R[k]=R[k].includes(v)?R[k].filter(x=>x!==v):[...R[k], v]; } else R[k]=v; recoRefresh(rowsId, full); };
window.recoGen = async (rowsId, full) => { await loadLib(); const R=S.reco; if(!R.mus.length) return toast('Elige al menos un músculo','err'); R.picks=[];
  const used=new Set(), ids=new Set(); R.mus.forEach(m=>{ const c=recoCands(m); let k=0; for(const x of c){ const root=fold(x.n).split(' ').slice(0,3).join(' '); if(used.has(root)||ids.has(x.i)) continue; used.add(root); ids.add(x.i); R.picks.push({i:x.i, mus:m}); if(++k>=R.n) break; } });
  if(!R.picks.length) toast('No hay ejercicios con ese equipamiento. Prueba con otro.','err'); recoRefresh(rowsId, full); };
window.recoSwap = (i, rowsId, full) => { const R=S.reco, pk=R.picks[i], taken=new Set(R.picks.map(p=>p.i)), c=recoCands(pk.mus).filter(x=>!taken.has(x.i)); if(!c.length) return toast('No hay más opciones para ese músculo','err');
  R.picks[i]={i:c[Math.floor(Math.random()*Math.min(6,c.length))].i, mus:pk.mus}; recoRefresh(rowsId, full); };
window.recoDel = (i, rowsId, full) => { S.reco.picks.splice(i,1); recoRefresh(rowsId, full); };
window.recoUsar = (rowsId, full) => { const R=S.reco, o=RECO_OBJ[R.obj], box=document.getElementById(rowsId); if(!box) return;
  [...box.querySelectorAll('.exrow')].forEach(r=>{ if(!r.querySelector('.e-n').value.trim()) r.remove(); });
  R.picks.forEach(pk=>{ const x=S.lib.find(e=>e.i===pk.i); if(x) box.insertAdjacentHTML('beforeend', exRow({ejercicio:x.n, exId:x.i, series:o.s, reps:o.r, rir:o.i, descanso:o.d}, full)); });
  const t=document.getElementById(rowsId==='rb-rows'?'rb-t':'mr-t'); if(t && !t.value) t.value=`${R.mus.join(' + ')} · ${R.obj}`;
  toast(`${R.picks.length} ejercicios agregados`); R.picks=[]; recoRefresh(rowsId, full); box.scrollIntoView({behavior:'smooth', block:'center'}); };

function keepNP(fn){ const k={}; NP_IDS.forEach(i=>k[i]=val(i)); fn(); render(); Object.entries(k).forEach(([i,v])=>{ const e=document.getElementById(i); if(e&&v) e.value=v; }); }
window.setNP = k => keepNP(()=>S.np.perfil=k);

window.crearPersona = async evaluar => {
  const nombre=val('np-nombre'), rut=val('np-rut').replace(/\s+/g,''), tel=val('np-tel'), org=S.np.org||'sm';
  if(!nombre || !rut || !tel) return toast('Nombre, RUT y teléfono son obligatorios','err');
  const ex=prof(`${org}|${normRut(rut)}`); if(ex){ toast('Esa persona ya existe'); return openPersona(keyOf(ex)); }
  const pin = /^\d{4}$/.test(val('np-pin')) ? val('np-pin') : (rut.replace(/\D/g,'').slice(0,4) || String(1000+Math.floor(Math.random()*9000)));
  const p={id:Date.now(), org, marca:val('np-marca')||'sm', estado:'activo', creadoPor:'pro', fecha:todayISO(), nombre, rut, pin, contacto:tel, edad:val('np-edad'), ocupacion:val('np-ocu'), deporte:val('np-dep'), emergencia:val('np-eme'),
    perfil:S.np.perfil, diagnostico:val('np-diag'), sesionesPlan:val('np-ses'), metaSemanal:val('np-meta'), klgo:evaluadores(org)[0],
    resultados:[], diarios:[], rutinasAsignadas:[], tareasClinicas:[], sesionesRehab:[], checkins:[], citas:[], avisos:[], rmLog:[]};
  if(!(await save(p))) return;
  toast(`${first(nombre)} creado · PIN ${pin}`);
  if(evaluar){ S.evMode = S.np.perfil==='entrenamiento' ? 'funcional' : 'kinesica'; pgo('evaluar', keyOf(p)); } else openPersona(keyOf(p));
};

function evalLines(d){
  const L=[], V=k=>esc(d[k]); const has=k=>d[k]!=null && String(d[k]).trim()!=='';
  if(d.tipo==='kinesica'){
    L.push(`<span class="badge rehabilitacion">Ficha kinésica</span>`);
    if(has('motivo')) L.push(`<strong>Motivo:</strong> ${V('motivo')}`);
    if(has('anamnesis')) L.push(`<strong>Anamnesis:</strong> ${V('anamnesis')}`);
    if(has('eva')) L.push(`<strong>Dolor EVA:</strong> ${V('eva')}/10`);
    if(has('rom')) L.push(`<strong>Examen físico:</strong> ${V('rom')}`);
    if(has('pruebas')) L.push(`<strong>Pruebas especiales:</strong> ${V('pruebas')}`);
    if(has('dx')) L.push(`<strong>Diagnóstico kinésico:</strong> ${V('dx')}`);
    if(has('plan')) L.push(`<strong>Objetivos y plan:</strong> ${V('plan')}`);
  } else {
    L.push(`<span class="badge entrenamiento">Evaluación funcional · ${esc(POB[d.poblacion]||'')}</span>`);
    if(has('enfoque')) L.push(`<strong>Enfoque:</strong> ${V('enfoque')}`);
    if(has('comorbilidades')||has('lesiones')) L.push(`<strong>Antecedentes:</strong> ${[d.comorbilidades,d.lesiones].filter(Boolean).map(esc).join(' · ')}`);
    const pe=+d.peso, ta=+d.talla; if(pe||ta) L.push(`<strong>Antropometría:</strong> ${V('peso')||'—'} kg · ${V('talla')||'—'} cm${pe&&ta?` · IMC ${(pe/Math.pow(ta/100,2)).toFixed(1)}`:''}`);
    if(has('pa')||has('fcr')||has('spo2')) L.push(`<strong>Signos vitales:</strong> PA ${V('pa')||'—'} · FCR ${V('fcr')||'—'} lpm · SpO2 ${V('spo2')||'—'}%${+d.edad?` · FC máx ${220-+d.edad}`:''}`);
    if(has('w_hrs')||has('w_ene')) L.push(`<strong>Bienestar:</strong> sueño ${V('w_hrs')||'—'} h · descanso ${V('w_desc')||'—'}/7 · agua ${V('w_agua')||'—'} L · energía ${V('w_ene')||'—'}/7 · estrés ${V('w_str')||'—'}/7 · fatiga ${V('w_fat')||'—'}/7`);
    if(has('hgd')||has('hgi')) L.push(`<strong>Handgrip:</strong> D ${V('hgd')||'—'} kg · I ${V('hgi')||'—'} kg`);
    (d.mov||[]).forEach(r=>L.push(`<strong>Movilidad · ${esc(r.mov)}:</strong> ${esc(r.dos)}${r.dolor==='Sí'?' · <b style="color:var(--red)">con dolor</b>':''}${r.obs?` · ${esc(r.obs)}`:''}`));
    if(has('vt1')||has('vt2')) L.push(`<strong>Umbrales:</strong> VT1 ${V('vt1')||'—'} · VT2 ${V('vt2')||'—'}`);
    (d.fuerza||[]).forEach(r=>{ const c=rmCalc(+r.kg,+r.reps); if(r.tipo==='manual'){ if(r.res||r.obs) L.push(`<strong>${esc(r.name)}:</strong> ${esc(r.res)}${r.obs?` · ${esc(r.obs)}`:''}`); } else if(c) L.push(`<strong>1RM ${esc(r.name)}:</strong> ${esc(r.kg)} kg × ${esc(r.reps)} → <b>${c.avg.toFixed(1)} kg</b>${r.obs?` · ${esc(r.obs)}`:''}`); else if(r.obs) L.push(`<strong>${esc(r.name)}:</strong> ${esc(r.obs)}`); });
    const bt=BAT[d.poblacion].filter(([k])=>d.bat&&d.bat[k]).map(([k,l])=>`${l}: ${esc(d.bat[k])}`); if(bt.length) L.push(`<strong>Batería:</strong> ${bt.join(' · ')}`);
    (d.tests||[]).forEach(r=>{ if(r.res||r.obs) L.push(`<strong>${esc(r.test)}:</strong> ${esc(r.res)}${r.obs?` (${esc(r.obs)})`:''}`); });
    if(has('conclusiones')) L.push(`<strong>Conclusiones:</strong> ${V('conclusiones')}`);
  }
  return L;
}
window.guardarEvaluacion = async () => {
  const p=prof(S.proArg), d=evCollect(), L=evalLines(d); if(L.length<2) return toast('Completa al menos un campo','err');
  const editing = S.editEval ? S.all.find(x=>x.id===S.editEval && x.org===p.org) : null;
  const target = editing || {...JSON.parse(JSON.stringify(p)), id:Math.max(Date.now(), p.id+1)};
  Object.assign(target, {fecha:d.fecha||todayISO(), klgo:d.klgo, resultados:L, evalData:d, evalTipo:d.tipo, edad:d.edad||p.edad, deporte:d.deporte||p.deporte,
    handgripDer: d.tipo==='funcional'?d.hgd:'', handgripIzq: d.tipo==='funcional'?d.hgi:''});
  if(d.tipo==='kinesica'){ if(d.sesiones) target.sesionesPlan=d.sesiones; if(d.dx && !target.diagnostico) target.diagnostico=d.dx.slice(0,90); }
  // 1RM de la evaluación → gráfico de fuerza de la persona (en el documento vigente)
  const latest = editing && editing.id!==p.id ? p : target;
  latest.rmLog=(latest.rmLog||[]).filter(r=>r.evalId!==target.id);
  if(d.tipo==='funcional') (d.fuerza||[]).forEach(r=>{ const c=rmCalc(+r.kg,+r.reps); if(c) latest.rmLog.push({id:uid(), fecha:target.fecha, ejercicio:r.name, kg:+r.kg, reps:+r.reps, rm:+c.avg.toFixed(1), fuente:'evaluacion', evalId:target.id}); });
  if(!editing){ if(d.tipo==='funcional' && d.pasos){ target.diarios=target.diarios||[]; target.diarios.push({id:uid(), fecha:target.fecha, pasos:d.pasos}); } addAviso(target,'evaluacion',`Tienes una nueva evaluación ${d.tipo==='funcional'?'funcional':'kinésica'} registrada`); }
  let ok=await save(target); if(ok && latest!==target) ok=await save(latest);
  if(ok){ toast(editing?'Evaluación actualizada':'Evaluación guardada'); S.evDraft=null; S.editEval=null; openPersona(keyOf(p),'clinico'); }
};

window.borrarEval = async () => { const p=prof(S.proArg), e=S.all.find(x=>x.id===S.editEval && x.org===p.org); if(!e) return;

function agMes(a){
  const m=S.agMes||todayISO().slice(0,7), [y,mo]=m.split('-').map(Number), d1=new Date(y,mo-1,1), days=new Date(y,mo,0).getDate(), off=(d1.getDay()+6)%7;
  const cs=citasDe(a.id).filter(x=>toISO(x.c.fecha).startsWith(m)), jor=(S.jornadas||[]).filter(j=>j.proId===a.id && String(j.fecha).startsWith(m));
  let h=['L','M','M','J','V','S','D'].map(x=>`<span class="hd">${x}</span>`).join(''); for(let i=0;i<off;i++) h+='<span></span>';
  for(let dd=1; dd<=days; dd++){ const ds=`${m}-${pad(dd)}`, n=cs.filter(x=>toISO(x.c.fecha)===ds).length, hrs=jor.filter(j=>j.fecha===ds).reduce((s,j)=>s+(+j.horas||0),0);
    const dc=cs.filter(x=>toISO(x.c.fecha)===ds).sort((x,y)=>String(x.c.hora).localeCompare(String(y.c.hora)));
    h+=`<button class="mday ${ds===todayISO()?'today':''} ${n||hrs?'act':''}" onclick="S.agDate='${ds}';S.agSeg='dia';render()"><b>${dd}</b>${dc.slice(0,3).map(x=>`<i style="background:color-mix(in srgb,${lugarCol(x.c.lugar)} 22%,transparent);color:var(--tx)">${esc(x.c.hora||x.c.bloque||'')} ${esc(first(x.p.nombre))}</i>`).join('')}${n>3?`<i>+${n-3}</i>`:''}${hrs?`<i class="hh">${hrs.toFixed(1)} h</i>`:''}</button>`; }
  return `<div class="card row between" style="padding:10px 12px"><span class="b">${MONL[mo-1]} ${y}</span><input type="month" class="inp" style="width:auto;min-height:36px;padding:6px 10px" value="${m}" onchange="S.agMes=this.value;render()"></div>
  <div class="card tight"><div class="mgrid">${h}</div></div>${horasResumen(jor, cs.length)}`;
}
function horasResumen(jor, nCitas){ const by={}; jor.forEach(j=>by[j.lugar]=(by[j.lugar]||0)+(+j.horas||0)); const tot=Object.values(by).reduce((a,b)=>a+b,0);
  return `<div class="grid4"><div class="stat acc"><b>${tot.toFixed(1)}</b><span>Horas trabajadas</span></div><div class="stat"><b>${nCitas}</b><span>Citas del mes</span></div>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([l,v])=>`<div class="stat"><b>${v.toFixed(1)}</b><span>${esc(l)}</span></div>`).join('')}</div>`; }
function agSolicitudes(sol){ return sol.length ? `<div class="list">${sol.map(({c,p})=>`<div class="li">${citaHTML(c,{who:p.nombre, right:`<button class="btn pri sm" onclick="sheetCita(${q(keyOf(p))},${c.id})">Revisar</button>`})}</div>`).join('')}</div>` : `<div class="card empty">No hay solicitudes pendientes.</div>`; }

/* disponibilidad: grilla semanal cada 30 minutos */
function agDisp(a){
  const ed=canEditAgenda(a); const brushes=[...placesOf(a).map(x=>x.code),'Todos','Borrar']; if(!brushes.includes(S.brush)) S.brush=brushes[0]; S.dispDraft = (S.dispDraft && S.dispDraft.id===a.id) ? S.dispDraft : JSON.parse(JSON.stringify({id:a.id, slots:a.slots||{}, bloqueos:a.bloqueos||[]}));
  const D=S.dispDraft, order=[1,2,3,4,5,6,0];
  return `${ed?`<div class="note">${ic('info','s')}<span>Elige el lugar y toca (o arrastra) los bloques de 30 minutos en que atiendes. Las personas verán mañana/tarde disponibles según esto.</span></div>
  <div class="pills" style="flex-wrap:wrap">${brushes.map(b=>`<button class="pill ${S.brush===b?'on':''}" onclick="S.brush=${q(b)};keepScroll(render)"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:${b==='Borrar'?'transparent':lugarCol(b)};border:1px solid var(--line2)"></span>${b==='Borrar'?'Borrar':esc(lugarLabel(b))}</button>`).join('')}</div>${placesOf(a).length?'':`<div class="note">${ic('alert','s')}<span>Primero agrega tus centros de atención en <b>Ajustes</b>.</span></div>`}`:`<div class="note">${ic('lock','s')}<span>Solo ${esc(a.nombre)} o la cuenta principal pueden editar esta disponibilidad.</span></div>`}
  <div class="card tight" style="overflow-x:auto"><div class="dgrid ${ed?'ed':''}" id="dgrid"><span></span>${order.map(w=>`<span class="hd">${DOW[w]}</span>`).join('')}
  ${HALF.map(h=>`<span class="dh">${h.endsWith(':00')?h:''}</span>${order.map(w=>{ const l=(D.slots[w]||{})[h]; return `<span class="dc" data-w="${w}" data-h="${h}" style="${l?`background:${lugarCol(l)}`:''}"></span>`; }).join('')}`).join('')}</div></div>
  ${ed?`<section class="card stack"><div class="b">Días bloqueados (vacaciones, feriados)</div><div class="row" style="gap:8px"><input class="inp" type="date" id="bq-d"><button class="btn sec" onclick="addBloqueo()">Bloquear</button></div>
  <div class="row" style="gap:6px;flex-wrap:wrap">${(D.bloqueos||[]).sort().map(b=>`<span class="badge">${fmtDate(b)} <button onclick="delBloqueo('${b}')">${ic('x','s')}</button></span>`).join('')||'<span class="xs muted">Sin días bloqueados</span>'}</div></section>
  <button class="btn pri block" onclick="guardarDisp()">Guardar disponibilidad</button>`:''}`;
}
let painting=false, paintVal=null;
function paintCell(el){ if(!el || !el.classList.contains('dc')) return; const D=S.dispDraft, w=el.dataset.w, h=el.dataset.h; D.slots[w]=D.slots[w]||{};
  if(paintVal===null) paintVal = (S.brush==='Borrar' || D.slots[w][h]===S.brush) ? '' : S.brush;
  if(paintVal) D.slots[w][h]=paintVal; else delete D.slots[w][h]; el.style.background = paintVal ? lugarCol(paintVal) : ''; }
document.addEventListener('pointerdown', e=>{ const g=e.target.closest('#dgrid.ed'); if(!g) return; painting=true; paintVal=null; paintCell(e.target); e.preventDefault(); });
document.addEventListener('pointermove', e=>{ if(!painting) return; paintCell(document.elementFromPoint(e.clientX,e.clientY)); });
document.addEventListener('pointerup', ()=>{ painting=false; paintVal=null; });
window.addBloqueo = () => { const d=val('bq-d'); if(!d) return; const D=S.dispDraft; D.bloqueos=[...new Set([...(D.bloqueos||[]), d])]; keepScroll(render); };
window.delBloqueo = d => { S.dispDraft.bloqueos=S.dispDraft.bloqueos.filter(x=>x!==d); keepScroll(render); };
window.guardarDisp = async () => { const ags=agendasVisibles(); const a={...(ags.find(x=>x.id===S.dispDraft.id)||myAgenda())}; a.slots=S.dispDraft.slots; a.bloqueos=S.dispDraft.bloqueos;
  if(await saveAgenda(a)){ S.dispDraft=null; toast('Disponibilidad guardada'); render(); } };

/* horas trabajadas */
function agHoras(a){
  const m=S.agMes||todayISO().slice(0,7), jor=(S.jornadas||[]).filter(j=>j.proId===a.id && String(j.fecha).startsWith(m)).sort((x,y)=>String(y.fecha+y.inicio).localeCompare(String(x.fecha+x.inicio)));
  const ed=canEditAgenda(a);
  return `${ed?`<section class="card stack"><div class="b">Registrar jornada</div>
    <div class="grid2"><label class="field"><span class="lbl">Fecha</span><input class="inp" type="date" id="jo-f" value="${todayISO()}"></label><label class="field"><span class="lbl">Lugar</span><select class="inp" id="jo-l">${SITIOS.map(s=>`<option>${s}</option>`).join('')}</select></label></div>
    <div class="grid2"><label class="field"><span class="lbl">Inicio</span><input class="inp" type="time" id="jo-i" value="08:00"></label><label class="field"><span class="lbl">Término</span><input class="inp" type="time" id="jo-t" value="14:00"></label></div>
    <label class="field"><span class="lbl">Tipo de atención</span><input class="inp" id="jo-k" placeholder="Box clínico, domicilio, evaluaciones…"></label>
    <button class="btn pri block" onclick="guardarJornada()">Guardar jornada</button></section>`:''}
  <div class="card row between" style="padding:10px 12px"><span class="b">Resumen de ${MONL[+m.slice(5)-1]}</span><input type="month" class="inp" style="width:auto;min-height:36px;padding:6px 10px" value="${m}" onchange="S.agMes=this.value;render()"></div>
  ${horasResumen(jor, citasDe(a.id).filter(x=>toISO(x.c.fecha).startsWith(m)&&x.c.estado!=='solicitada').length)}
  ${jor.length?`<div class="list">${jor.map(j=>`<div class="li"><span class="ico">${ic('clock','s')}</span><div class="grow"><div class="b sm">${fmtDate(j.fecha)} · ${esc(j.lugar)}</div><div class="xs muted">${esc(j.inicio)} – ${esc(j.termino)} · ${(+j.horas||0).toFixed(1)} h${j.tipo?` · ${esc(j.tipo)}`:''}</div></div>${ed?`<button class="ibtn red" onclick="borrarJornada(${q(j.id)})">${ic('trash','s')}</button>`:''}</div>`).join('')}</div>`:`<div class="card empty">Sin jornadas registradas este mes.</div>`}`;
}
window.guardarJornada = async () => { const i=val('jo-i'), t=val('jo-t'); const mins=s=>{ const [h,m]=s.split(':').map(Number); return h*60+m; }; const hrs=(mins(t)-mins(i))/60;
  if(!(hrs>0)) return toast('La hora de término debe ser posterior al inicio','err');
  const j={id:String(uid()), proId:S.agId, pro:agendaOf(S.agId)?.nombre||S.pro.nombre, fecha:val('jo-f'), inicio:i, termino:t, horas:+hrs.toFixed(2), lugar:val('jo-l'), tipo:val('jo-k')};
  if(await fsSet('jornadas', j.id, j)){ S.jornadas.push(j); toast(`Jornada guardada: ${hrs.toFixed(1)} h`); keepScroll(render); } };
window.borrarJornada = async id => { if(!confirm('¿Eliminar esta jornada?')) return; if(await fsDel('jornadas', id)){ S.jornadas=S.jornadas.filter(j=>j.id!==id); keepScroll(render); } };

/* ---- hoja de cita (profesional) ---- */

  const p=k?prof(k):null, c=p&&id?(p.citas||[]).find(x=>x.id===id):null, ps=people();
  const ags=agendasVisibles();
  S.ci={tipo:c?.tipo||preset.tipo||(isOdonto()?'Control':'Kinesiología'), lugar:c?.lugar||preset.lugar||null, proId:c?.proId||preset.proId||S.agId||S.pro.id};
  const pills=(arr,key,lab=x=>x)=>`<div class="pills" style="flex-wrap:wrap" id="ci-${key}">${arr.map(a=>`<button type="button" class="pill ${S.ci[key]===a?'on':''}" onclick="S.ci.${key}='${a}';document.querySelectorAll('#ci-${key} .pill').forEach(b=>b.classList.toggle('on',b.dataset.v==='${a}'));ciHoras()" data-v="${a}">${esc(lab(a))}</button>`).join('')}</div>`;

  <div class="stack" style="margin-top:14px">
  ${p?`<div class="row">${avatar(p,36)}<div class="grow"><div class="b">${esc(p.nombre)}</div><div class="xs muted">${esc(p.contacto||'')}</div></div><button class="btn sec sm" onclick="closeSheet();openPersona(${q(k)})">Ficha</button></div><input type="hidden" id="ci-p" value="${esc(k)}">`:`<label class="field"><span class="lbl">Persona</span><select class="inp" id="ci-p">${ps.map(x=>`<option value="${esc(keyOf(x))}">${esc(x.nombre)}${S.pro.org==='all'?` (${x.org==='kah'?'KAH':'SM'})`:''}</option>`).join('')}</select></label>`}
  <div><div class="lbl">Tipo</div>${pills(servAg(agendaOf(S.ci.proId))==='oral'?TIPOS_ORAL:TIPOS_CITA,'tipo')}</div>
  <label class="field"><span class="lbl">Profesional</span><select class="inp" id="ci-k" onchange="S.ci.proId=this.value;ciLugares();ciHoras()">${ags.map(a=>`<option value="${esc(a.id)}" ${a.id===S.ci.proId?'selected':''}>${esc(a.nombre)}</option>`).join('')}</select></label>
  <div><div class="lbl">Lugar</div><div id="ci-lug"></div></div>
  <div class="grid2"><label class="field"><span class="lbl">Fecha</span><input class="inp" type="date" id="ci-f" value="${esc(toISO(c?.fecha)||preset.fecha||todayISO())}" onchange="ciHoras()"></label><label class="field"><span class="lbl">Hora</span><input class="inp" type="time" id="ci-h" value="${esc(c?.hora||preset.hora||'')}"></label></div>
  <div id="ci-free"></div>
  <label class="field"><span class="lbl">Dirección / indicaciones</span><input class="inp" id="ci-n" value="${esc(c?.direccion||c?.notaPro||p?.direccion||'')}" placeholder="Dirección del domicilio, box, qué traer…"></label>
  ${c?.pago?.requerido?`<div class="card tight stack"><div class="row between"><span class="b sm">Pago previo${c.servicio==='oral'?'':' (domicilio)'}</span><span class="badge ${c.pago.estado==='pagado'?'acc':'mixto'}">${c.pago.estado==='pagado'?'Pagado':c.pago.estado==='informado'?'Persona informó pago':'Pendiente'}</span></div><label class="check"><input type="checkbox" id="ci-pg" ${c.pago.estado==='pagado'?'checked':''}><span>Pago recibido</span></label></div>`:''}

  ${c&&c.estado!=='cancelada'&&c.estado!=='solicitada'?`<div class="grid2"><button class="btn sec" onclick="estadoCita(${c.id},'realizada')">${ic('check','s')} Realizada</button><button class="btn danger" onclick="estadoCita(${c.id},'cancelada')">${ic('x','s')} Cancelar</button></div>`:''}
  ${c&&c.estado==='solicitada'?`<button class="btn danger block" onclick="estadoCita(${c.id},'cancelada')">${ic('x','s')} Rechazar solicitud</button>`:''}</div>`);
  S.ciBloque=c?.bloque||null; ciLugares(); ciHoras();
};
window.ciLugares = () => { const box=$('#ci-lug'); if(!box) return; const a=agendaOf(S.ci.proId)||myAgenda(); const pl=placesOf(a);
  if(S.ci.lugar && !pl.find(x=>x.code===S.ci.lugar)) pl.unshift({code:S.ci.lugar, label:lugarLabel(S.ci.lugar)}); if(!S.ci.lugar) S.ci.lugar=pl[0]?.code||'Domicilio';
  box.innerHTML=`<div class="pills" style="flex-wrap:wrap">${pl.map(x=>`<button type="button" class="pill ${S.ci.lugar===x.code?'on':''}" onclick="S.ci.lugar=${q(x.code)};ciLugares();ciHoras();ciDir()">${esc(x.label)}</button>`).join('')||'<span class="xs muted">Sin lugares configurados</span>'}</div>`; };
window.ciDir = () => { const i=$('#ci-n'); if(!i) return; const cen=String(S.ci.lugar).startsWith('C:')?centroById(S.ci.lugar.slice(2)):null; if(cen) i.value=cen.direccion||''; };
window.ciHoras = () => { const box=$('#ci-free'); if(!box) return; const a=agendaOf(S.ci.proId)||myAgenda(), d=val('ci-f');
  if(!hasSlots(a)){ box.innerHTML=''; return; }
  const fr=freeSlots(a,d,null,S.ci.lugar), pref=S.ciBloque?fr.filter(s=>inBlock(s.h,S.ciBloque)):fr;
  box.innerHTML = fr.length ? `<div class="lbl">Horas libres ${S.ciBloque?`(${S.ciBloque==='AM'?'mañana':'tarde'} primero)`:''}</div><div class="pills" style="flex-wrap:wrap">${[...pref, ...fr.filter(s=>!pref.includes(s))].map(s=>`<button type="button" class="pill" onclick="$('#ci-h').value='${s.h}';document.querySelectorAll('#ci-free .pill').forEach(b=>b.classList.toggle('on',b.textContent==='${s.h}'))">${s.h}</button>`).join('')}</div>` : `<div class="xs muted">Sin horas libres ese día en tu disponibilidad. Puedes escribir la hora igual.</div>`; };
const videoRoomFor = (p, proId) => (agendaOf(proId||S.pro?.id)?.linkVideo) || `https://meet.jit.si/StrongMed-${normRut(p.rut).slice(-5)}-${Math.random().toString(36).slice(2,8)}`;
window.guardarCita = async id => {
  const k=val('ci-p'), p=prof(k); if(!p) return toast('Elige una persona','err'); const f=val('ci-f'), h=val('ci-h'); if(!f||!h) return toast('Indica fecha y hora','err');
  p.citas=p.citas||[]; let c=id?p.citas.find(x=>x.id===id):null; const wasReq=c&&c.estado==='solicitada', moved=c&&!wasReq&&(toISO(c.fecha)!==f||c.hora!==h);
  const pg=$('#ci-pg'); if(c?.pago?.requerido){ c.pago.estado = pg&&pg.checked ? 'pagado' : (c.pago.estado==='pagado'?'pendiente':c.pago.estado); if(c.pago.estado!=='pagado' && !confirm('El pago previo no está marcado como recibido. ¿Confirmar la hora igual?')) return; }
  const a=agendaOf(S.ci.proId);
  if(!c){ c={id:uid(), creadaPor:'pro', creada:Date.now()}; p.citas.push(c); }
  Object.assign(c,{servicio:servAg(a), tipo:S.ci.tipo, lugar:S.ci.lugar, lugarNombre:lugarLabel(S.ci.lugar), proId:S.ci.proId, pro:a?.nombre||S.pro.nombre, fecha:f, hora:h, direccion:val('ci-n'), estado:'confirmada', confirmadaPor:S.pro.nombre});
  if(c.lugar==='Online' && !c.link) c.link=videoRoomFor(p, c.proId);
  const when=`${fmtDate(f)} a las ${h} · ${lugarLabel(c)}${c.direccion&&c.lugar!=='Domicilio'?` (${c.direccion})`:''}`;
  (p.avisos||[]).forEach(x=>{ if(x.tipo==='cita') x.leido=true; });
  addAviso(p,'cita', wasReq?`¡Tu hora fue confirmada! ${c.tipo}, ${when}` : moved?`Tu sesión fue reprogramada: ${when}` : id?`Tu sesión fue actualizada: ${when}` : `Tienes una sesión de ${c.tipo}: ${when}`);
  if(await save(p)){ closeSheet(); toast(wasReq?'Hora confirmada y avisada':'Sesión agendada y avisada'); keepScroll(render); } };
window.estadoCita = async (id, est) => { const k=val('ci-p'), p=prof(k), c=p.citas.find(x=>x.id===id);
  if(est==='cancelada' && !confirm(c.estado==='solicitada'?'¿Rechazar esta solicitud? La persona recibirá un aviso.':'¿Cancelar esta sesión? La persona recibirá un aviso.')) return;
  c.estado=est; if(est==='cancelada') addAviso(p,'cita', `Tu ${c.hora?`sesión del ${fmtDate(c.fecha)} a las ${c.hora}`:`solicitud del ${fmtDate(c.fecha)}`} fue cancelada. Escríbenos para reagendar.`);
  if(!(await save(p))) return; closeSheet(); toast(est==='realizada'?'Marcada como realizada':'Cancelada');
  if(est==='realizada' && isOdonto()){ S.proArg=k; if(isPending(p)) await habilitarOral(); sheetAtencion(); return; }
  if(est==='realizada' && isPending(p)){ S.proArg=k; sheetHabilitar(true); } else keepScroll(render); };

/* ================= ¿CÓMO TE SIENTES HOY? ================= */
const ANIMO = [['😣','Muy mal'],['🙁','Mal'],['😐','Regular'],['🙂','Bien'],['😄','Excelente']];

  (p.checkins||[]).forEach(c=>{ const v=Math.round(((+c.sueno||3)+(+c.dolor||3)+(+c.estres||3)+(+c.energia||3))/4); m.set(toISO(c.fecha), {fecha:toISO(c.fecha), v}); });
  (p.animo||[]).forEach(a=>m.set(a.fecha, a)); return [...m.values()].filter(a=>a.fecha).sort((a,b)=>a.fecha.localeCompare(b.fecha)); }
const lastAnimo = p => animoList(p).pop();
const WL = [
  {k:'sueno', t:'Calidad del sueño', lo:'Muy mala', hi:'Excelente'},
  {k:'energia', t:'Energía', lo:'Agotado/a', hi:'A tope'},
  {k:'estres', t:'Estrés', lo:'Muy alto', hi:'Muy bajo'},
  {k:'dolor', t:'Dolor o molestia muscular', lo:'Mucho', hi:'Nada'}
];

  return `<section class="card stack" id="wl-card"><div class="row"><span class="ico blue">${ic('heart')}</span><div class="grow"><div class="b">¿Cómo te sientes hoy?</div><div class="xs muted">${t&&!S.wlEdit?'Registro de hoy guardado. Tu kine ya lo puede ver.':'Tu registro diario de bienestar. Tu kine ve cómo vas.'}</div></div>${t&&!S.wlEdit?`<button class="btn ghost sm" onclick="S.wlEdit=true;keepScroll(render)">Editar</button>`:''}</div>
  <div class="mood">${ANIMO.map(([e,l],i)=>`<button class="${w.v===i+1?'on':''}" style="--c:${SC[i]}" ${open?`onclick="wlSet('v',${i+1})"`:''}><span>${e}</span><small>${l}</small></button>`).join('')}</div>
  ${open ? `${WL.map(scale).join('')}

const SALTOS = ['CMJ','SJ','Abalakov','Drop jump'];
const hFromTv = ms => 9.81*Math.pow(ms/1000,2)/8*100;
const sayers = (h, kg) => 60.7*h + 45.3*kg - 2055;
function saltoCard(p){
  const log=(p.saltos||[]).slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))); const tipos=[...new Set(log.map(s=>s.tipo))];
  S.stTipo=SALTOS.includes(S.stTipo)?S.stTipo:'CMJ';
  const pal=['--acc','--blue','--orange','--pink','--green'];
  S.after.push(()=>{ if(!tipos.length) return; const labels=[...new Set(log.map(s=>s.fecha))].sort();
    mkChart('c-salto','line', labels.map(fmtShort), tipos.map((t,i)=>({label:t+' (cm)', data:labels.map(f=>{ const v=log.filter(s=>s.tipo===t&&s.fecha===f).map(s=>s.altura); return v.length?Math.max(...v):null; }), borderColor:cssv(pal[i%5]), backgroundColor:cssv(pal[i%5]), tension:.3, borderWidth:2.5, pointRadius:4, spanGaps:true}))); });
  const best=t=>Math.max(...log.filter(s=>s.tipo===t).map(s=>+s.altura));
  return `<section class="card stack"><div><div class="b">Saltos</div><div class="xs muted">Graba tu salto, marca el despegue y el aterrizaje, y listo.</div></div>
  ${tipos.length?`<div class="row" style="gap:6px;flex-wrap:wrap">${tipos.map(t=>`<span class="badge acc">${esc(t)} · mejor ${best(t).toFixed(1)} cm</span>`).join('')}</div><div class="chart"><canvas id="c-salto"></canvas></div>`:''}
  <div class="pills" style="flex-wrap:wrap">${SALTOS.map(t=>`<button class="pill ${S.stTipo===t?'on':''}" onclick="S.stTipo='${t}';keepScroll(render)">${t}</button>`).join('')}</div>
  <div class="grid2"><label class="btn pri" style="cursor:pointer">${ic('video','s')} Grabar salto<input type="file" accept="video/*" capture="environment" class="hidden" onchange="saltoVideo(event)"></label><label class="btn sec" style="cursor:pointer">${ic('upload','s')} Elegir video<input type="file" accept="video/*" class="hidden" onchange="saltoVideo(event)"></label></div>
  ${log.length?`<details><summary class="xs b muted" style="padding:4px 0">Ver registros (${log.length})</summary><div class="stack" style="gap:6px;margin-top:8px">${log.slice().reverse().map(s=>`<div class="row sm" style="gap:8px"><span class="grow">${fmtDate(s.fecha)} · ${esc(s.tipo)}${s.tv?` · ${s.tv} ms`:''}</span><b>${(+s.altura).toFixed(1)} cm</b><button class="ibtn red" style="width:30px;height:30px" onclick="borrarSalto(${s.id})">${ic('x','s')}</button></div>`).join('')}</div></details>`:''}</section>`;

function onMotion(e){ const g=e.accelerationIncludingGravity; if(!g) return; const a=Math.sqrt((g.x||0)**2+(g.y||0)**2+(g.z||0)**2); const P=S.ped; P.avg = P.avg ? P.avg*0.92 + a*0.08 : a; const now=Date.now();

/* ================= ACTIVIDADES CON GPS (trote, bicicleta, caminata) ================= */
const GPS_T = {Trote:{v:'trotas', pace:true, max:9, zancada:1.1}, Caminata:{v:'caminas', pace:true, max:4, zancada:0.75}, Bicicleta:{v:'pedaleas', pace:false, max:25}};

const fmtPace = (ms, m) => { if(m<30) return '--:--'; const sPerKm=ms/1000/(m/1000); return `${Math.floor(sPerKm/60)}:${pad(Math.round(sPerKm%60))}`; };
const fmtSpeed = (ms, m) => ms>0 ? (m/1000/(ms/3600000)).toFixed(1) : '0.0';
const gpsKey = () => 'sm_gps_'+S.me;
function persistGps(){ try{ S.gps ? localStorage.setItem(gpsKey(), JSON.stringify(S.gps)) : localStorage.removeItem(gpsKey()); }catch(e){} }
function restoreGps(){ try{ const g=JSON.parse(localStorage.getItem(gpsKey())); if(g && Date.now()-g.t0 < 8*3600e3){ S.gps=g; g.paused=true; g.since=null; } }catch(e){} }
/* mapas gratuitos y sin clave (si uno falla se usa el siguiente). El GPS es el del propio teléfono: gratis. */
const TILES=[['https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png','© OpenStreetMap © CARTO','abcd'],
  ['https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png','© OpenStreetMap · HOT','abc'],
  ['https://tile.openstreetmap.org/{z}/{x}/{y}.png','© OpenStreetMap','abc']];
function baseLayer(map, i=0){ const [u,att,sub]=TILES[i]; let errs=0; const l=L.tileLayer(u,{maxZoom:19, subdomains:sub, attribution:att}).addTo(map);
  l.on('tileerror', ()=>{ if(++errs===3 && TILES[i+1]){ map.removeLayer(l); baseLayer(map, i+1); } }); return l; }
let gpsWatch=null, gpsMap=null, gpsLine=null, gpsDot=null;
async function loadLeaflet(){ if(window.L) return true; return new Promise(res=>{ const l=document.createElement('link'); l.rel='stylesheet'; l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(l);
  const s=document.createElement('script'); s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload=()=>res(true); s.onerror=()=>res(false); document.head.appendChild(s); }); }
window.iniciarGps = async tipo => {
  if(!('geolocation' in navigator)) return toast('Este teléfono no permite usar el GPS desde el navegador','err');
  if(S.gps && !confirm('Tienes una actividad en curso. ¿Descartarla y empezar otra?')) { go('gps'); return; }
  S.gps={tipo, t0:Date.now(), since:Date.now(), acc:0, paused:false, pts:[], dist:0}; persistGps(); watchGps(); keepAwake(true); S.patTab='gps'; render(); scrollTo({top:0}); };
function watchGps(){ if(gpsWatch!=null) navigator.geolocation.clearWatch(gpsWatch);
  gpsWatch=navigator.geolocation.watchPosition(pos=>{ const g=S.gps; if(!g) return; const c=pos.coords, pt=[+c.latitude.toFixed(6), +c.longitude.toFixed(6), pos.timestamp||Date.now()];
    S.gpsFix={acc:Math.round(c.accuracy)}; const fx=$('#gps-acc'); if(fx) fx.textContent=`GPS ±${S.gpsFix.acc} m`; const wk=$('#gps-weak'); if(wk) wk.classList.toggle('hidden', c.accuracy<=40);
    if(g.paused || c.accuracy>40) return; const last=g.pts[g.pts.length-1];
    if(last){ const d=hav(last,pt), dt=(pt[2]-last[2])/1000; if(d<4) return; if(dt>0 && d/dt>GPS_T[g.tipo].max*1.6) return; g.dist+=d; }

  const set=(id,v)=>{ const e=$(id); if(e) e.textContent=v; };
  set('#gps-t', fmtClock(ms/1000)); set('#gps-d', (g.dist/1000).toFixed(2)); set('#gps-p', GPS_T[g.tipo].pace?fmtPace(ms,g.dist):fmtSpeed(ms,g.dist));

async function initGpsMap(){ const el=$('#gps-map'); if(!el) return; if(!(await loadLeaflet())){ el.innerHTML='<div class="empty" style="padding-top:90px">Mapa no disponible sin conexión. Tu recorrido se sigue registrando.</div>'; return; }
  gpsMap=L.map(el,{zoomControl:false, attributionControl:true}); baseLayer(gpsMap);
  const ll=S.gps.pts.map(p=>[p[0],p[1]]); gpsLine=L.polyline(ll,{color:'#ccff33', weight:6, opacity:.95}).addTo(gpsMap); gpsDot=L.circleMarker(ll[ll.length-1]||[-36.827,-73.050],{radius:8, color:'#fff', weight:3, fillColor:'#ccff33', fillOpacity:1}).addTo(gpsMap);

function vGps(p){
  const g=S.gps; if(!g){ S.patTab='entrenar'; return vEntrenar(p); }

window.gpsPausa = () => { const g=S.gps; g.acc=gpsElapsed(g); g.paused=true; g.since=null; persistGps(); keepAwake(false); render(); };
window.gpsReanudar = () => { const g=S.gps; g.paused=false; g.since=Date.now(); if(gpsWatch==null) watchGps(); persistGps(); keepAwake(true); render(); };

function stopGps(){ if(gpsWatch!=null) navigator.geolocation.clearWatch(gpsWatch); gpsWatch=null; keepAwake(false); gpsMap=null; }
function simplify(pts, max=400){ const ll=pts.map(p=>[+p[0].toFixed(5), +p[1].toFixed(5)]); if(ll.length<=max) return ll; const k=Math.ceil(ll.length/max); return ll.filter((_,i)=>i%k===0 || i===ll.length-1); }

  <label class="field"><span class="lbl">Notas</span><input class="inp" id="gp-n" placeholder="Ej: buenas sensaciones"></label><button class="btn pri block" onclick="guardarGps()">Guardar actividad</button></div>`); };
window.guardarGps = async () => { if(!S.rpe) return toast('Elige el esfuerzo (RPE)','err'); const g=S.gps, p=me(), ms=g.acc, T=GPS_T[g.tipo];
