<style>
:root{
  --acc:#ccff33; --acc-ink:#0a0a0a;
  --bg:#060607; --card:#111114; --card2:#1a1a1f; --card3:#222228;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --tx:#f4f4f6; --mu:#8a8a93;
  --red:#ff5a4f; --orange:#ff9f2e; --yellow:#ffd23f; --green:#3ddc84; --blue:#5aa2ff; --pink:#ff6fae;
  --acc-tx:var(--acc); --acc-soft:color-mix(in srgb,var(--acc) 13%,transparent);
  --r:20px; --tabh:74px; --lg-cross:#ccff33; --lg-bar:#ffffff;
}
:root[data-theme="light"]{
  --bg:#f2f2ef; --card:#ffffff; --card2:#f3f3f0; --card3:#e9e9e5;
  --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.13);
  --tx:#111113; --mu:#6b6b72;
  --acc-tx:color-mix(in srgb,var(--acc) 48%,#000);
  --acc-soft:color-mix(in srgb,var(--acc) 22%,transparent);
  --lg-cross:#9ed600; --lg-bar:#0a0a0b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:15px;line-height:1.42;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100dvh;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon.s{width:16px;height:16px}.icon.l{width:24px;height:24px}

/* type */
.disp{font-family:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;font-weight:800;text-transform:uppercase;line-height:.92;letter-spacing:.005em}
.mega{font-size:64px}.h1{font-size:40px}.h2{font-size:30px}.h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.acc-t{color:var(--acc-tx)}.muted{color:var(--mu)}.b{font-weight:700}
.sm{font-size:13px}.xs{font-size:12px}.center{text-align:center}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* layout */
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(var(--tabh) + 40px + env(safe-area-inset-bottom))}
.wrap.wide{max-width:1040px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.grid4{grid-template-columns:repeat(4,1fr)}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 2px}
.sec-t h2{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.tight{padding:12px}
.hero{background:var(--acc);color:var(--acc-ink);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero .eyebrow{color:currentColor;opacity:.62}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.18)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left}
.li+.li{border-top:1px solid var(--line)}
button.li:active{background:var(--card2)}
.ico{width:36px;height:36px;border-radius:11px;background:var(--acc-soft);color:var(--acc-tx);display:grid;place-items:center;flex:none}
.ico.blue{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.ico.orange{background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--orange)}
.ico.red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.chev{color:var(--mu)}
.empty{color:var(--mu);font-size:13px;text-align:center;padding:22px 10px}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--card2);font-size:13px;color:var(--mu)}
.note .icon{color:var(--blue);margin-top:1px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--mu);white-space:nowrap}
.badge.acc,.badge.entrenamiento{background:var(--acc-soft);color:var(--acc-tx)}
.badge.rehabilitacion{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.badge.mixto{background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--orange)}
.badge.red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.hero .badge{background:rgba(0,0,0,.12);color:inherit}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:14.5px;transition:transform .12s,opacity .12s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.sec{background:var(--card2);border:1px solid var(--line)}
.btn.dark{background:rgba(0,0,0,.86);color:var(--acc)}
.btn.ghost{color:var(--acc-tx)}
.btn.danger{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.btn.sm{height:36px;padding:0 13px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card2);color:var(--mu);flex:none}
.ibtn.red{color:var(--red)}

/* forms */
.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;font-size:15px;min-height:46px}
.inp:focus{border-color:var(--acc)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.45}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:0 0 6px 2px}
.field{display:block}
.seg{display:flex;background:var(--card2);border-radius:13px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:0 9px;white-space:nowrap;height:36px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mu);text-align:center}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.25)}
:root[data-theme="light"] .seg button.on{background:#fff}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{height:34px;padding:0 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mu);white-space:nowrap}
.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=range]{width:100%;accent-color:var(--acc)}
.searchbox{position:relative}.searchbox .icon{position:absolute;left:14px;top:13px;color:var(--mu)}.searchbox .inp{padding-left:42px}

/* avatar */
.av{border-radius:50%;background:var(--card3) center/cover;display:grid;place-items:center;font-weight:800;color:var(--acc-tx);flex:none;border:1.5px solid var(--line2)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0;border-radius:14px;font-size:10.5px;color:var(--mu);font-weight:700;text-transform:uppercase}
.day b{font-size:16px;color:var(--tx);font-weight:700}
.day .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;color:var(--acc-ink)}
.day .dot .icon{width:12px;height:12px;stroke-width:3}
.day.done .dot{background:var(--acc);border-color:var(--acc)}
.day.today{background:var(--acc-soft)}
.day.future{opacity:.45}

/* ring */
.ring{position:relative;flex:none}.ring svg{width:100%;height:100%;display:block}
.ring .bg{stroke:var(--card3);fill:none}.ring .fg{stroke:var(--acc);fill:none;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring.blue .fg{stroke:var(--blue)}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring-in b{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800}
.ring-in small{font-size:10.5px;color:var(--mu);font-weight:600;margin-top:2px}

/* exercise list (plan) */
.exl{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.ex{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--card2)}
.hero .ex{background:rgba(0,0,0,.08)}
.cc{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--line2);display:grid;place-items:center;color:transparent;flex:none}
.cc .icon{width:14px;height:14px;stroke-width:3}
.cc.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.sr{font-size:13px;color:var(--mu);font-weight:600;white-space:nowrap}
.vid{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc-tx);flex:none}
.rt.done .exl,.rt.done h3,.rt.done .donebar{opacity:.6}
.donebar{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green);font-weight:700;font-size:13.5px;margin-top:12px}

/* check-in scale */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{height:44px;border-radius:12px;background:var(--card2);font-weight:700;text-align:center;border-bottom:3px solid var(--c);transition:transform .1s}
.scale button.on{background:var(--c);color:#0a0a0a;transform:translateY(-1px)}
.scale-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mu);margin-top:5px}
.ci-sum{display:flex;gap:6px;flex-wrap:wrap}
.ci-sum span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:10px;background:var(--card2)}
.ci-sum i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c)}

/* workout */
.wo-head{position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(18px)}
.wo-time{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:800;color:var(--acc-tx);font-variant-numeric:tabular-nums}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 1fr 42px;gap:6px;align-items:center;margin-top:6px}
.setrow.head{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-align:center;margin-top:12px}
.setrow .sn{text-align:center;font-weight:800;color:var(--mu);font-size:13px}
.setrow input{height:42px;text-align:center;background:var(--card2);border:1px solid transparent;border-radius:11px;outline:none;font-weight:700;width:100%;min-width:0}
.setrow input:focus{border-color:var(--acc)}
.chk{width:42px;height:42px;border-radius:11px;background:var(--card2);display:grid;place-items:center;color:var(--mu)}
.setrow.done input{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.setrow.done .chk{background:var(--acc);color:var(--acc-ink)}
.setrow.done .sn{color:var(--acc-tx)}
.restbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + 8px + env(safe-area-inset-bottom));z-index:35;padding:0 12px}
.rb-in{max-width:536px;margin:0 auto;background:var(--card3);border:1px solid var(--line2);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.4);position:relative;overflow:hidden}
.rb-t{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.rb-fill{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);transition:width 1s linear}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button{height:44px;border-radius:12px;background:var(--card2);font-weight:800;text-align:center}
.rpe button.on{background:var(--acc);color:var(--acc-ink)}

/* progress */
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:800;line-height:1}
.stat span{font-size:12px;color:var(--mu);font-weight:600}
.stat.acc b{color:var(--acc-tx)}
button.stat{text-align:left}
.bar{height:8px;border-radius:99px;background:var(--card3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat .h{aspect-ratio:1;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--mu)}
.heat .h.on{background:var(--acc);color:var(--acc-ink)}
.heat .h.today{outline:1.5px solid var(--tx)}
.heat .h.fut{opacity:.3}
.heat .hd{font-size:10px;font-weight:700;color:var(--mu);text-align:center;text-transform:uppercase}
.chart{position:relative;height:210px}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line2);border-radius:2px}
.tl-i{position:relative;padding:0 0 16px}
.tl-i:before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.tl-i.blue:before{background:var(--blue)}
.tl-i .body{font-size:13.5px;color:var(--tx);margin-top:4px;line-height:1.5}
.tl-i .body strong{font-weight:700}
.ficha{display:grid;gap:12px;margin-top:6px}.ficha .fi{padding-bottom:12px;border-bottom:1px solid var(--line)}.ficha .fi:last-child{border-bottom:0;padding-bottom:0}
.ficha .fl{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}.ficha .fv{font-size:15px;line-height:1.6;color:var(--tx);margin-top:4px;white-space:pre-line;overflow-wrap:anywhere}.ficha .fv strong,.ficha .fv b{font-weight:700}
.seg button.lockd{opacity:.55}.seg button.lockd svg{width:14px;height:14px;vertical-align:-2px;margin-right:2px}

/* chat */
.wrap.chatmode{padding-bottom:0}
.chat{display:flex;flex-direction:column;height:calc(100dvh - var(--tabh) - 30px - env(safe-area-inset-bottom) - env(safe-area-inset-top));min-height:360px}
.chat-h{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.chat-m{flex:1;overflow-y:auto;padding:14px 2px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:80%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.4;position:relative;word-wrap:break-word;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--card2);border-bottom-left-radius:6px}
.bub time{display:block;font-size:10.5px;opacity:.55;margin-top:3px;text-align:right}
.bub .del{display:none;position:absolute;left:-34px;top:50%;transform:translateY(-50%);color:var(--red)}
.bub.sel .del{display:block}
.chat-f{display:flex;gap:8px;padding:10px 0 12px;border-top:1px solid var(--line)}
.chat-f .inp{border-radius:999px}
.chat-f .btn{width:48px;padding:0;border-radius:50%}
.msgs{display:grid;gap:14px}
@media(min-width:900px){.msgs{grid-template-columns:320px 1fr}.msgs .mlist{display:block!important}.msgs .mpane{display:block!important}}
.msgs.has .mlist{display:none}.msgs:not(.has) .mpane{display:none}
.chat-it.on{background:var(--acc-soft)}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;height:calc(var(--tabh) + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding:9px 4px env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--mu);text-align:center}
.tab .icon{width:23px;height:23px}
.tab{position:relative}
.ccard{min-width:230px;white-space:normal}.ccard .hopt .icon{width:16px;height:16px;flex:none}.ccard .ico{background:color-mix(in srgb,currentColor 12%,transparent)}
.hopt{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,currentColor 8%,transparent);border:1px solid color-mix(in srgb,currentColor 18%,transparent);color:inherit;font-size:13.5px;text-align:left}
.hopt span{flex:1}.hopt.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.hopt[disabled]:not(.on){opacity:.55}.bub.me .ccard .ico{color:var(--acc-ink);background:rgba(0,0,0,.12)}.bub.me .hopt.on{background:rgba(0,0,0,.86);color:var(--acc);border-color:transparent}.nbadge{font-style:normal;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-left:auto}
.tab .nbadge{position:absolute;top:-2px;left:calc(50% + 6px);margin:0}
.tab.on{color:var(--tx)}.tab.on .icon{color:var(--acc-tx)}
.fabc{width:60px;height:60px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin-top:-28px;border:5px solid var(--bg);box-shadow:0 8px 28px color-mix(in srgb,var(--acc) 30%,transparent);position:relative}
.tab.fab .icon{color:var(--acc-ink)!important;width:26px;height:26px}
.live{position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--bg);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}

/* pro sidebar */
.side{display:none}
@media(min-width:900px){
  .pro .side{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:248px;padding:24px 16px;border-right:1px solid var(--line);background:var(--bg);z-index:20}
  .pro .wrap{margin-left:248px;margin-right:0;padding-left:32px;padding-right:32px;padding-bottom:40px;max-width:1100px}
  .pro .tabbar{display:none}
  .pro .wrap.chatmode .chat{height:calc(100dvh - 60px)}
  .pro .restbar{bottom:20px}
}
@media(min-width:1440px){ .pro .wrap{max-width:1280px} }
/* persona en tablet: columna más ancha y barra del mismo ancho, centrada */
@media(min-width:700px) and (max-width:899px){
  .pat .wrap{max-width:680px;padding-left:24px;padding-right:24px}
  .pat .tabbar{left:50%;right:auto;width:min(680px,100%);transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0}
  .pat .restbar{left:50%;right:auto;width:min(680px,100%);transform:translateX(-50%)}
}
/* persona en escritorio: la barra de abajo pasa a menú lateral */
@media(min-width:900px){
  .pat .tabbar{top:0;bottom:0;right:auto;width:220px;height:auto;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:2px;padding:calc(84px + env(safe-area-inset-top)) 14px 24px;border-top:0;border-right:1px solid var(--line);background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
  .pat .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;border-radius:12px;font-size:14px;text-align:left}
  .pat .tab:hover{background:var(--card2)}
  .pat .tab.on{background:var(--card2);color:var(--tx)}
  .pat .tab.fab{order:-1}
  .pat .fabc{width:auto;height:auto;margin:0;border:0;background:none;box-shadow:none;display:inline-grid}
  .pat .tab.fab .icon{color:var(--mu)!important;width:23px;height:23px}
  .pat .tab.fab.on .icon{color:var(--acc-tx)!important}
  .pat .tab .nbadge{position:static;margin-left:auto}
  .pat .wrap{max-width:none;margin:0 0 0 220px;padding-left:max(32px,calc((100vw - 220px - 820px)/2));padding-right:max(32px,calc((100vw - 220px - 820px)/2));padding-bottom:48px}
  .pat .wrap.chatmode .chat{height:calc(100dvh - 60px)}
  .pat .restbar{left:220px;bottom:20px}
  .pat .kbar{bottom:10px}
}
.side .nav{display:flex;flex-direction:column;gap:2px;margin-top:26px}
.side .nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;color:var(--mu)}
.side .nav button.on{background:var(--card2);color:var(--tx)}.side .nav button.on .icon{color:var(--acc-tx)}

/* header */
.top{margin-bottom:6px}
.logo-m{width:40px;height:40px;border-radius:12px;background:#111;border:1px solid var(--line2);display:grid;place-items:center;overflow:hidden;flex:none}
.logo-m img{width:100%;height:100%;object-fit:contain;padding:3px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--acc-tx);font-weight:600;font-size:14px;margin-bottom:6px}

/* login */
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 18px;position:relative;overflow:hidden}
.glow{position:absolute;inset:-20% -20% auto;height:70%;background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 22%,transparent),transparent);pointer-events:none}
.login-in{width:100%;max-width:400px;min-width:0;position:relative;display:flex;flex-direction:column;gap:16px}
.login .mega{font-size:clamp(44px,14vw,82px);white-space:nowrap}
.pin{letter-spacing:.6em;text-align:center;font-weight:800;font-size:20px}

/* sheet & toast */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet-bg.in{opacity:1}
.sheet{width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;background:var(--card);border:1px solid var(--line2);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .25s cubic-bezier(.2,.9,.3,1)}
.sheet-bg.in .sheet{transform:none}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:26px}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 14px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-30px);opacity:0;z-index:80;background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;transition:.25s;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.in{transform:translate(-50%,0);opacity:1}
.toast.err{background:var(--red);color:#fff}

/* builder rows */
.exrow{background:var(--card2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.exrow .inp{background:var(--card);min-height:40px;padding:9px 12px;font-size:14px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g5 label,.g4 label{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.g5 .inp,.g4 .inp{text-align:center;padding:8px 4px;margin-top:3px}
.pcard{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:var(--card2);border:2px solid transparent;text-align:left}
.pcard.on{border-color:var(--acc);background:var(--acc-soft)}
.pcard small{font-size:12px;color:var(--mu)}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line2)}
.swatch.on{box-shadow:0 0 0 2px var(--tx)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}

/* ===== v2 additions ===== */
.brands{display:flex;align-items:center;gap:8px}
.brands .x{color:var(--mu);font-weight:700;font-size:12px}
.lg{height:34px;border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:none}
.lg.sm{width:40px;border-radius:0;overflow:visible}
.lg.sm svg{width:100%;height:100%;display:block}
.lg.sm.l{width:52px;height:46px}
.lg.kah{background:#ccff33;width:34px;padding:6px}
.lg.kah svg{width:100%;height:100%}
.lg.l{height:44px;width:44px;border-radius:13px}
.brandtxt{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:15px;line-height:1;letter-spacing:.02em}
.brandtxt small{display:block;font-family:Inter,sans-serif;font-size:10px;font-weight:600;color:var(--mu);text-transform:none;letter-spacing:0;margin-top:2px}
.hbtn{position:relative;width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.dotn{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;background:color-mix(in srgb,var(--blue) 12%,var(--card));border:1px solid color-mix(in srgb,var(--blue) 30%,transparent)}
.aviso.acc{background:color-mix(in srgb,var(--acc) 10%,var(--card));border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
.aviso.red{background:color-mix(in srgb,var(--red) 10%,var(--card));border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.aviso .ico{background:transparent}
.cita{display:flex;gap:14px;align-items:center}
.cita .cd{width:58px;flex:none;text-align:center;border-radius:14px;background:var(--card2);padding:8px 0;line-height:1}
.cita .cd b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800}
.cita .cd span{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase}
.hero .cita .cd{background:rgba(0,0,0,.1)}.hero .cita .cd span{color:inherit;opacity:.65}
.st-solicitada{color:var(--orange)}.st-confirmada{color:var(--green)}.st-cancelada{color:var(--red)}.st-realizada{color:var(--mu)}
.faq{border-top:1px solid var(--line)}.faq:first-child{border-top:0}
.faq summary{display:flex;align-items:center;gap:12px;padding:15px 16px;font-weight:600}
.faq summary .icon{transition:transform .2s;color:var(--mu)}
.faq[open] summary .icon{transform:rotate(90deg)}
.faq .ans{padding:0 16px 16px;color:var(--mu);font-size:14px;line-height:1.55;white-space:pre-wrap}
.libgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.libgrid{grid-template-columns:repeat(4,1fr)}}
.libc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.libc .im{aspect-ratio:1;background:#fff;position:relative}
.libc .im img{width:100%;height:100%;object-fit:cover}
.libc .bd{padding:10px 12px}
.libc .bd b{display:block;font-size:13px;line-height:1.3}
.thumb{width:46px;height:46px;border-radius:12px;background:#fff center/cover;flex:none;border:1px solid var(--line)}
.gifbox{background:#fff;border-radius:18px;overflow:hidden;display:grid;place-items:center}
.gifbox img{width:100%;max-width:340px;aspect-ratio:1;object-fit:contain}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{list-style:none;counter-increment:s;display:flex;gap:10px;font-size:14px;line-height:1.5;color:var(--mu)}
.steps li:before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:1px}
.vcall{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.12)}
.tbl{display:flex;flex-direction:column;gap:8px}
.trow{background:var(--card2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.trow .inp{background:var(--card);min-height:38px;padding:8px 11px;font-size:13.5px}
.trow .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.trow .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g4h{display:grid;grid-template-columns:1fr 1fr 1fr 1.15fr;gap:6px;padding:0 10px;font-size:10.5px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin-bottom:-4px}
.trow .g4t{display:grid;grid-template-columns:1fr 1fr 1fr 1.15fr;gap:6px}
.esq{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.esq legend{font-weight:700;font-size:14px;margin-bottom:6px;line-height:1.35;padding:0}
.esq.miss legend{color:var(--red)}.esq.miss .opt{border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:13.5px;line-height:1.35;cursor:pointer;transition:background .15s,border-color .15s}
.opt input{accent-color:var(--acc);width:18px;height:18px;flex:none;margin:0}
.opt:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,var(--card2));color:var(--tx)}
.sec-sub{font-size:11.5px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.yn{display:inline-flex;background:var(--card2);border-radius:10px;padding:2px;gap:2px;flex:none}
.yn label{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--mu);cursor:pointer}
.yn input{display:none}.yn label:has(input:checked){background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.yn label.si:has(input:checked){background:var(--red);color:#fff}
.rfrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.35}
.body-map{display:grid;grid-template-columns:1fr 1fr;gap:10px}.body-map figure{margin:0;text-align:center}
.body-map svg{width:100%;max-height:330px}.body-map figcaption{font-size:12px;font-weight:700;color:var(--mu)}
.body-map text{fill:var(--mu);font-size:9px;font-weight:800}
.body-map .z{fill:var(--card3);stroke:var(--bg);stroke-width:1.2;cursor:pointer;transition:fill .15s}
.body-map .z:hover{fill:color-mix(in srgb,var(--red) 35%,var(--card3))}.body-map .z.on{fill:var(--red)}
.pchk{display:inline-flex;align-items:center;cursor:pointer}.pchk input{display:none}.pchk:has(input:checked){background:var(--tx);color:var(--bg);border-color:var(--tx)}
.nd{background:var(--card2);border-radius:14px;padding:10px 12px}.nd summary{list-style:none;cursor:pointer}.nd summary::-webkit-details-marker{display:none}
.nrow{display:grid;grid-template-columns:1fr 88px 88px;gap:6px;align-items:center}.nrow .inp{min-height:36px;padding:6px 8px;font-size:13px;background:var(--card)}
.cmp{width:100%;border-collapse:collapse;font-size:13px}.cmp td,.cmp th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.cmp td:first-child,.cmp th:first-child{text-align:left;white-space:normal}.cmp th{font-size:11px;color:var(--mu);text-transform:uppercase}
.up{color:var(--green)}.dn{color:var(--red)}
.rmres{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.rmres div{background:var(--card2);border-radius:12px;padding:8px 4px}
.rmres b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800}
.rmres span{font-size:10.5px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.rmres div.avg{background:var(--acc);color:var(--acc-ink)}.rmres div.avg span{color:inherit;opacity:.7}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mu)}
.check input{width:20px;height:20px;accent-color:var(--acc);flex:none;margin-top:1px}
.pend{background:color-mix(in srgb,var(--orange) 12%,var(--card));border:1px solid color-mix(in srgb,var(--orange) 35%,transparent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}.kv dt{color:var(--mu)}.kv dd{font-weight:600}
.orgchip{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;background:#ccff33;color:#111;letter-spacing:.04em}
.orgchip.sm{background:var(--card3);color:var(--tx)}
.big-link{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:16px;border:1.5px dashed var(--line2);color:var(--mu);font-weight:600}
@media(min-width:900px){.mob-only{display:none!important}}
/* ===== v3 additions ===== */
.dchips{gap:6px;padding-bottom:4px}
.dchip{flex:none;width:58px;padding:8px 0;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;line-height:1.1;font-size:11px;color:var(--mu);font-weight:700;text-transform:uppercase}
.dchip b{font-family:'Barlow Condensed',sans-serif;font-size:24px;color:var(--tx);font-weight:800}
.dchip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.dchip.on b{color:var(--acc-ink)}
.dchip[disabled]{opacity:.35;text-decoration:line-through}
.voucher{background:var(--card);border:1.5px dashed color-mix(in srgb,var(--acc) 55%,transparent);border-radius:22px;padding:18px;position:relative}
.voucher .vh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vcut{height:0;border-top:2px dashed var(--line2);margin:16px -18px;position:relative}
.vcut:before,.vcut:after{content:'';position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1.5px dashed color-mix(in srgb,var(--acc) 55%,transparent)}
.vcut:before{left:-12px;clip-path:inset(0 0 0 50%)}.vcut:after{right:-12px;clip-path:inset(0 50% 0 0)}
.sheet .voucher{background:var(--card2)}.sheet .vcut:before,.sheet .vcut:after{background:var(--card)}
.slot{display:flex;gap:10px;align-items:stretch;min-height:38px;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot .sh{width:44px;flex:none;font-size:12px;font-weight:700;color:var(--mu);padding-top:10px;font-variant-numeric:tabular-nums}
.slot .grow{display:flex;flex-direction:column;gap:4px;padding:4px 0}
.scita{text-align:left;border-radius:10px;padding:7px 10px;background:color-mix(in srgb,var(--c) 18%,var(--card2));border-left:4px solid var(--c);display:flex;flex-direction:column}
.scita b{font-size:13.5px}.scita span{font-size:12px;color:var(--mu)}
.sfree{text-align:left;border-radius:10px;padding:7px 10px;border:1.5px dashed color-mix(in srgb,var(--c) 60%,transparent);color:var(--mu);font-size:12.5px;font-weight:600}
.sempty{display:block;height:28px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mgrid .hd{font-size:10px;font-weight:700;color:var(--mu);text-align:center;text-transform:uppercase;padding:4px 0}
.mday{min-height:62px;border-radius:10px;background:var(--card2);padding:5px;display:flex;flex-direction:column;gap:2px;text-align:left;overflow:hidden}
.mday b{font-size:12px}.mday i{font-style:normal;font-size:10px;font-weight:700;background:var(--acc-soft);color:var(--acc-tx);border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden}
.mday i.hh{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.mday.today{outline:1.5px solid var(--tx)}.mday.act{background:var(--card3)}
.dgrid{display:grid;grid-template-columns:42px repeat(7,minmax(34px,1fr));gap:2px;min-width:320px;user-select:none;touch-action:none}
.dgrid .hd{font-size:11px;font-weight:700;color:var(--mu);text-align:center;text-transform:uppercase;padding-bottom:4px}
.dgrid .dh{font-size:10.5px;color:var(--mu);font-weight:600;text-align:right;padding-right:6px;line-height:18px}
.dgrid .dc{height:18px;border-radius:4px;background:var(--card2)}
.dgrid.ed .dc{cursor:pointer}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood button{border-radius:14px;background:var(--card2);padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border-bottom:3px solid var(--c);transition:transform .1s}
.mood button span{font-size:26px;line-height:1}.mood button small{font-size:10.5px;font-weight:700;color:var(--mu)}
.mood button.on{background:color-mix(in srgb,var(--c) 30%,var(--card2));transform:translateY(-2px)}.mood button.on small{color:var(--tx)}
.rmchip small{opacity:.7}
.a4wrap{overflow-x:auto;padding:4px 0 20px}
.a4body:focus,.a4foot:focus{outline:2px dashed #9be15d;outline-offset:6px}
.brands .kids{font-size:13px;padding:2px 6px}
.pcard .grow b,.pcard .grow small{display:block}
.tbig{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:800;width:58px;flex:none;font-variant-numeric:tabular-nums}
/* ---- pasos ---- */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.jsala{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.jtile{display:block;text-align:left;background:var(--card);border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line));border-radius:16px;padding:12px;min-width:0}.wo-time.xs{font-size:14px}.jfila{gap:10px}.jfila.on{background:color-mix(in srgb,var(--c,var(--acc)) 8%,transparent)}.jhora{width:44px;flex:none;font-weight:800;font-size:13px}
.jboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start}
@media (max-width:420px){ .jboard{grid-template-columns:1fr} }
.jcard{scroll-margin-top:12px}.jcard.on{border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.jhead{width:100%;gap:10px}.jhead .chev{transition:transform .2s}.jhead .chev.rot{transform:rotate(90deg)}
.wo-time.sm{font-size:18px}
.jex{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.thumb.sm{width:40px;height:40px;flex:none}
.csw{width:32px;height:32px;border-radius:10px;background:var(--c);border:3px solid transparent;flex:none}.csw.on{border-color:var(--tx)}
.csq{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--c);flex:none;vertical-align:middle}

/* ================= MEDIDOR DE USO DE FIREBASE =================
   Cuenta las lecturas, escrituras y borrados que hace la app y los suma por día (hora del Pacífico,
   que es cuando Firebase renueva la cuota gratuita) en la colección "uso" de Firebase StrongMed. */
const CUOTA = {r:50000, w:20000, d:20000};
const diaPT = (d=new Date()) => new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles', year:'numeric', month:'2-digit', day:'2-digit'}).format(d);
function msHastaRenovar(){ const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles', hour:'numeric', minute:'numeric', second:'numeric', hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return ((24-(+p.hour))*3600 - (+p.minute)*60 - (+p.second))*1000; }
const USO = {pend:{}, hoy:{}};
function dbName(ref){ const db=ref && (ref.firestore || ref.db || (ref.parent && ref.parent.firestore)); return db===S.dbs.kah ? 'kah' : 'sm'; }
function usoAdd(proj, k, n){ if(!n) return; const P=USO.pend[proj]=USO.pend[proj]||{}; P[k]=(P[k]||0)+n; const H=USO.hoy[proj]=USO.hoy[proj]||{}; H[k]=(H[k]||0)+n; }
function medirFB(F){
  const W={...F};
  if(F.getDocFromCache) W.getDocFromCache = r => F.getDocFromCache(r);
  if(F.getDocsFromCache) W.getDocsFromCache = q => F.getDocsFromCache(q);
  W.getDocs = async q => { const s=await F.getDocs(q); if(!(s.metadata&&s.metadata.fromCache)) usoAdd(dbName(q),'r',Math.max(1,s.size||0)); return s; };
  if(F.getDoc) W.getDoc = async r => { const s=await F.getDoc(r); if(!(s.metadata&&s.metadata.fromCache)) usoAdd(dbName(r),'r',1); return s; };
  W.setDoc = (r, ...a) => { usoAdd(dbName(r),'w',1); return F.setDoc(r, ...a); };
  W.deleteDoc = r => { usoAdd(dbName(r),'d',1); return F.deleteDoc(r); };
  if(F.writeBatch) W.writeBatch = db => { const b=F.writeBatch(db), set=b.set.bind(b); b.set=(r,...a)=>{ usoAdd(dbName(r),'w',1); return set(r,...a); }; return b; };
  W.onSnapshot = (r, cb, ...a) => F.onSnapshot(r, s=>{ if(!(s.metadata&&s.metadata.fromCache)){ const n = typeof s.docChanges==='function' ? s.docChanges().length : (s.size!=null ? s.size : 1); usoAdd(dbName(r),'r',Math.max(1,n)); } cb(s); }, ...a);
  return W;
}

  Object.entries(pend).forEach(([pj,o])=>Object.entries(o).forEach(([k,n])=>{ data[`${pj}_${k}`]=inc(n); })); data.sm_w = inc(((pend.sm||{}).w||0)+1); data.actualizado=Date.now();
  try{ await F.setDoc(F.doc(S.dbs.sm,'uso',diaPT()), data, {merge:true}); }catch(e){ console.warn('uso', e); } }
setInterval(usoFlush, 90000);

  if(src!=='cache' && sy.t && now-(sy.full||0) < 24*3600e3 && F.getDocsFromCache && F.where){
    try{ const [loc, cambios]=await Promise.all([F.getDocsFromCache(col), F.getDocs(F.query(col, F.where('upd','>', sy.t - 3600e3)))]);
      if(loc.size){ const m=new Map(); loc.forEach(d=>m.set(d.id,d)); cambios.forEach(d=>m.set(d.id,d)); snapDocs=[...m.values()]; inc=true; S._sync=(S._sync||0)+cambios.size; } }catch(e){ console.warn('sync parcial', e); } }
  if(!snapDocs){ const snap=await getQ(src, col); snapDocs=[]; snap.forEach(d=>snapDocs.push(d)); if(src!=='cache') sy.full=now; }
  if(src!=='cache'){ sy.t=now; try{ localStorage.setItem(syncKey(org), JSON.stringify(sy)); }catch(e){} }
  snapDocs.forEach(d=>{ const x=d.data(); if(x && x.rut){ x.org=x.org||org; out.push(x); } });
  if(org==='kah'){
    try{ const ruts=new Set(out.map(x=>normRut(x.rut))), pc=F.collection(db,'patients'); let ls=await getQ(inc?'cache':src, pc); if(inc && !ls.size) ls=await getQ(src, pc);
      ls.forEach(d=>{ const x=d.data(); if(x && x.rut && !ruts.has(normRut(x.rut))) out.push(fromLegacyKAH(x)); }); }
    catch(e){ console.warn('Sin colección antigua patients', e); }
  }
  return out;
}

async function loadLib(){
  if(S.lib){ if(!S.libProOk && S.lib.length && S.fb && S.dbs && S.dbs.sm){ S.libProOk=true; const [p, mods, vis]=await Promise.all([loadEjPro(), loadEjMod(), loadEjVis()]); const all=S.libAll.concat(p); applyEjMod(all, mods); applyEjVis(all, vis); S.lib=S.lib.filter(x=>!x.o).concat(p.filter(x=>!x.o)); libIndex(all); EJ_THUMBS.clear(); } return S.lib; }
  S.libProOk=!!(S.fb && S.dbs && S.dbs.sm);
  try{ let r=null; for(const u of ['data/ejercicios.json?v=35', MEDIA_BASE+'data/ejercicios.json']){ try{ r=await fetch(u); if(r.ok) break; }catch(x){} r=null; } if(!r) throw 0;
    // "o": ejercicio oculto (repetido con otro nombre). No se muestra en la biblioteca, pero las rutinas antiguas lo siguen abriendo.
    const [pro, mods, vis]=await Promise.all([loadEjPro(), loadEjMod(), loadEjVis()]), all=(await r.json()).concat(EJ_EXTRA, pro);
    all.forEach(x=>{ if(!x.a && EJ_ANIM[x.i]){ x.a=EJ_ANIM[x.i][0]; x.h=EJ_ANIM[x.i][1]; } });
    applyEjMod(all, mods); applyEjVis(all, vis); S.lib=all.filter(x=>!x.o); libIndex(all);
    fillLibDatalist(); }
  catch(e){ S.lib=[]; S.libByName=new Map(); S.libById=new Map(); console.warn('Biblioteca de ejercicios no disponible (sube data/ejercicios.json)'); }
  return S.lib;
}
function libIndex(all){ S.libAll=all; S.libByName=new Map(); S.libById=new Map();
  [...all.filter(x=>!x.o), ...all.filter(x=>x.o)].forEach(x=>{ if(!S.libById.has(x.i)) S.libById.set(x.i,x); const k=x.n.toLowerCase(); if(!S.libByName.has(k)) S.libByName.set(k,x); });
  // "al": ids y nombres de ejercicios fusionados o renombrados, para que las rutinas antiguas los sigan encontrando
  all.forEach(x=>(x.al||[]).forEach(([i,n])=>{ if(i && !S.libById.has(i)) S.libById.set(i,x); const k=String(n||'').toLowerCase(); if(k && !S.libByName.has(k)) S.libByName.set(k,x); })); }

async function loadEjMod(){ try{ if(!S.fb || !S.dbs || !S.dbs.sm) return {}; const sn=await S.fb.getDocs(S.fb.collection(S.dbs.sm,'ejercicios_mod')); const m={}; sn.forEach(d=>{ const x=d.data(); if(x && x.a!==undefined && !x.borrado) m[d.id]=x; }); return m; }catch(e){ console.warn('ejercicios_mod', e); return {}; } }

async function migrarOral(){ if(!S.pro || !(isOdonto()||isAdmin()) || S._oralMig) return; S._oralMig=true;
  const m={}; S.all.forEach(p=>{ const r=normRut(p.rut); if(!S.oralDocs[r] && !p._oralSep && oralTiene(p.oral) && (!m[r] || m[r].id<p.id)) m[r]=p; });
  for(const p of Object.values(m)){ const r=normRut(p.rut); S.oralDocs[r]=p.oral; oralAttach(p); await saveOral(p, true); } }
async function saveOral(p, silent){ if(!p) return false; const r=normRut(p.rut); if(!r) return false;
  const o=p.oral||{}; S.oralDocs[r]=o; p._oralSep=true; Object.assign(o,{rutN:r, rut:p.rut, nombre:p.nombre, upd:Date.now()});
  if(!S.fb){ if(!silent) toast('Sin conexión: no se guardó','err'); return false; }
  try{ return await fsWrite(S.fb.setDoc(S.fb.doc(S.dbs.sm,'odontologia',r), JSON.parse(JSON.stringify(o)))); }
  catch(e){ console.error(e); if(!silent) toast('No se pudo guardar la ficha dental. Revisa tu conexión','err'); return false; } }

/* ================= SEGURIDAD: Firebase Authentication =================
   Personas:      correo interno <rut>.<pin>@p.strongmed.app   → las reglas solo dejan leer SU ficha, sus mensajes y sus citas.
   Profesionales: correo interno <usuario>.<huella>@pro.strongmed.app → las reglas revisan su acceso en la colección "acceso".
   Si Authentication aún no está activado en Firebase, la app sigue funcionando como antes (modo abierto). */
function sha256(str){ // implementación compacta (funciona también abriendo el archivo desde el computador)
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=new TextEncoder().encode(str), l=b.length, n=((l+9+63)>>6)<<6, m=new Uint8Array(n); m.set(b); m[l]=0x80; const dv=new DataView(m.buffer); dv.setUint32(n-4, l*8>>>0); dv.setUint32(n-8, Math.floor(l/0x20000000));
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]; const W=new Array(64), r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<n;o+=64){ for(let t=0;t<16;t++) W[t]=dv.getUint32(o+t*4); for(let t=16;t<64;t++){ const s0=r(W[t-15],7)^r(W[t-15],18)^(W[t-15]>>>3), s1=r(W[t-2],17)^r(W[t-2],19)^(W[t-2]>>>10); W[t]=(W[t-16]+s0+W[t-7]+s1)|0; }
    let [a,b2,c,d,e,f,g,h]=H; for(let t=0;t<64;t++){ const S1=r(e,6)^r(e,11)^r(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[t]+W[t])|0, S0=r(a,2)^r(a,13)^r(a,22), mj=(a&b2)^(a&c)^(b2&c), t2=(S0+mj)|0; h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b2; b2=a; a=(t1+t2)|0; }
    H=H.map((v,i)=>(v+[a,b2,c,d,e,f,g,h][i])|0); }
  return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join(''); }
const hA = (u,c) => sha256(`A|${u}|${c}`), hB = (u,c) => sha256(`B|${u}|${c}`).slice(0,20);
const proUser = u => String(u||'').toLowerCase().replace(/[^a-z0-9_-]/g,'');
const proEmail = (u,h) => `${proUser(u)}.${h}@pro.strongmed.app`;

const patEmail = (rutN,pin) => `${rutN}.${pin}@p.strongmed.app`, patPass = (rutN,pin) => `SMp!${rutN}${pin}`;
const AUTH_MAL = 'MAL';
async function entrar(auth, email, pass){ // inicia sesión o crea la cuenta la primera vez. Devuelve true, AUTH_MAL o null (Authentication no activado)
  if(!S.AU || !auth) return null; const AU=S.AU;
  if(auth.currentUser && auth.currentUser.email===email) return true;
  try{ await AU.signInWithEmailAndPassword(auth, email, pass); return true; }
  catch(e){ const c=e.code||'';
    if(/operation-not-allowed|configuration-not-found|admin-restricted/.test(c)){ S.authOff=true; return null; }
    if(/network|unavailable|internal/.test(c)) return null;
    if(/invalid-credential|user-not-found|invalid-login|wrong-password|invalid-email/.test(c)){
      try{ await AU.createUserWithEmailAndPassword(auth, email, pass); return true; }
      catch(e2){ const c2=e2.code||''; if(/email-already-in-use/.test(c2)) return AUTH_MAL; if(/operation-not-allowed|configuration-not-found|admin-restricted/.test(c2)){ S.authOff=true; return null; } if(/weak-password/.test(c2)) return AUTH_MAL; console.warn(e2); return null; } }
    if(/too-many-requests/.test(c)){ toast('Demasiados intentos. Espera unos minutos.','err'); return AUTH_MAL; }
    console.warn(e); return null; } }
async function salirAuth(){ await quitarPush(); if(!S.AU || !S.auth) return; for(const a of Object.values(S.auth)){ try{ if(a.currentUser) await S.AU.signOut(a); }catch(e){} } }

async function entrarPaciente(rut, pin){ const r=normRut(rut), p=patPin(pin); if(!p || !(await initFB())) return null;
  const res=await Promise.all(['sm','kah'].map(o=>entrar(S.auth?.[o], patEmail(r,p), patPass(r,p)))); return res.includes(true) ? true : res.includes(AUTH_MAL) ? AUTH_MAL : null; }

async function registrarRut(org, rut, pin, esNuevo){ const F=S.fb, db=S.dbs[org||'sm'], r=normRut(rut), p=String(pin||'');
  if(!F.writeBatch) return true;
  try{ const b=F.writeBatch(db); b.set(F.doc(db,'ruts',r), {org:org||'sm', t:Date.now()}, esNuevo?{}:{merge:true}); b.set(F.doc(db,'pines',r), {pin:p}, esNuevo?{}:{merge:true}); await fsWrite(b.commit()); return true; }
  catch(e){ console.warn('ruts', e); return false; } }

async function fsSet2(org, coll, id, data, merge){ try{ return await fsWrite(S.fb.setDoc(S.fb.doc(S.dbs[org], coll, String(id)), JSON.parse(JSON.stringify(data)), merge?{merge:true}:{})); }catch(e){ console.error(e); return false; } }
const orgsDe = org => org==='all' ? ['sm','kah'] : [org||'sm'];
async function entrarPro(usuario, clave){
  const u=proUser(usuario), h=hB(u,clave), em=proEmail(u,h);
  const r=await entrar(S.auth?.sm, em, clave); if(r===AUTH_MAL) return null;
  let acc=await accesoDe('sm', u);
  if(acc===null) return null;                                           // las reglas no lo dejan: contraseña incorrecta
  if(acc){ if(acc.h!==h || acc.activo===false) return null; }
  else { const b=BUILTIN_PROS.find(x=>x.usuario===u && x.hA===hA(u,clave));
    if(b){ acc={id:b.id, usuario:u, nombre:b.nombre, org:b.org, rol:b.rol, esp:b.esp||'', builtin:true, h, activo:true}; await guardarAcceso('sm', u, acc); }
    else { await loadPros(); const old=S.pros.find(x=>proUser(x.usuario)===u && x.clave && x.clave===clave && x.activo!==false); if(!old) return null;  // cuenta creada antes de la seguridad
      acc={id:old.id, usuario:u, nombre:old.nombre, org:old.org||'sm', rol:old.rol||'pro', esp:old.esp||'', h, activo:true}; await guardarAcceso('sm', u, acc); } }
  if(orgsDe(acc.org).includes('kah')){ const r2=await entrar(S.auth?.kah, em, clave); if(r2===true){ const a2=await accesoDe('kah', u); if(a2===false) await guardarAcceso('kah', u, acc); } }
  return acc; }
async function borrarClavesAntiguas(){ if(!isAdmin()) return; for(const p of S.pros.filter(x=>x.clave)){
  const acc={id:p.id, usuario:proUser(p.usuario), nombre:p.nombre, org:p.org||'sm', rol:p.rol||'pro', esp:p.esp||'', h:hB(proUser(p.usuario), p.clave), activo:p.activo!==false};
  for(const o of ['sm',...(orgsDe(acc.org).includes('kah')?['kah']:[])]) await guardarAcceso(o, acc.usuario, acc); const q={...p}; delete q.clave; await fsSet('profesionales', p.id, q); } }

/* ================= SESIÓN PRESENCIAL =================
   Programa presencial de cada persona (p.pres): rutinas que rotan solas, planes de entrenamiento y registro de sesiones.
   La sesión la abre el profesional (Jornada) o la persona; la persona anota sus series y solo el profesional la finaliza.
   Es aparte de las rutinas enviadas. p.presActiva marca a quien está en sala para que la Jornada la siga en vivo. */
const PRES_TIPO = {entrenamiento:'Entrenamiento', recovery:'Recovery', rehabilitacion:'Rehabilitación', mixto:'Mixto'};
const presTipoC = t => t==='recovery'?'blue':t==='rehabilitacion'?'mixto':'acc';
const presTipoDef = p => { const pa=presPlanAct(p); return pa&&pa.tipo!=='mixto' ? pa.tipo : perfilOf(p)==='rehabilitacion' ? 'rehabilitacion' : 'entrenamiento'; };
const spOf = p => { const x=p.pres=p.pres||{}; x.rutinas=x.rutinas||[]; x.planes=x.planes||[]; x.sesiones=x.sesiones||[]; if(!(x.sig>=0)) x.sig=0; return x; };
const presRut = p => (p&&p.pres&&p.pres.rutinas)||[];
const presSigIdx = p => { const n=presRut(p).length; return n ? ((+(p.pres.sig)||0)%n+n)%n : -1; };
const presSig = p => presRut(p)[presSigIdx(p)] || null;
const presEnCurso = p => (p&&p.pres&&p.pres.enCurso)||null;
const presPlanes = p => (p&&p.pres&&p.pres.planes)||[];
const presSes = p => (p&&p.pres&&p.pres.sesiones)||[];
const presPlanAct = p => presPlanes(p).find(x=>x.id===p.pres.plan && x.estado!=='cerrado') || null;
const presTiene = p => !!(presRut(p).length || presEnCurso(p) || presSes(p).length);
const presDom = k => String(k).replace(/[^a-z0-9]/gi,'_');
const presObj = e => `${e.series||3}×${e.reps||'—'}${e.kg||e.kilos?` · ${e.kg||e.kilos} kg`:''}${e.rir!==''&&e.rir!=null?` · RIR ${e.rir}`:''}`;
const presCuenta = w => { const t=w.ex.reduce((a,e)=>a+e.sets.length,0), d=w.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0); return {t,d}; };

const presSetIni = e => ({kg:e.kg||e.kilos||'', reps:String(e.reps||'').includes('-')?String(parseInt(e.reps)||''):(e.reps||''), rir:String(e.rir||'').includes('-')?String(parseInt(e.rir)||''):(e.rir||''), done:false, t:0});

  x.enCurso={id:String(uid()), inicio:Date.now(), rid:r?r.id:'', titulo:r?r.titulo:'Sesión presencial', tipo:tipo||'entrenamiento', planId:planId||'', abre, pro:S.role==='pro'?S.pro.nombre:(p.klgo||''), proId:S.role==='pro'?S.pro.id:'',
    ex:(r?r.ejercicios:[]).map(e=>({n:e.ejercicio, exId:e.exId||'', rest:parseRest(e.descanso), obj:presObj(e), sets:Array.from({length:Math.max(1,Math.min(10,+e.series||3))},()=>presSetIni(e))}))};

const OBJ_TIPOS = [['rm','Levantar un peso (RM)'],['evento','Competencia o evento'],['libre','Otro objetivo']];
function mejorRM(p, nombre){ const n=fold(nombre); let best=null;
  const consider=(rm,fecha,kg,reps,fuente)=>{ if(rm>0 && (!best || rm>best.rm)) best={rm:+rm.toFixed(1),fecha,kg,reps,fuente}; };
  (p.rmLog||[]).forEach(r=>{ if(fold(r.ejercicio)===n) consider(+r.rm, r.fecha, r.kg, r.reps, r.fuente==='evaluacion'?'evaluación':'registro de RM'); });
  (p.diarios||[]).forEach(d=>(d.ejercicios||[]).forEach(e=>{ if(fold(e.ejercicio)!==n) return; const sets=(e.sets&&e.sets.length)?e.sets:[{kg:e.kilos??e.kg, reps:e.reps}];
    sets.forEach(t=>{ const kg=parseFloat(String(t.kg).replace(',','.')), r=parseInt(t.reps); if(kg>0 && r>0 && r<=12) consider(r===1?kg:est1RM(kg,r), toISO(d.fecha), kg, r, 'entrenamiento'); }); }));
  return best; }
function objProgreso(p,o){ if(o.tipo!=='rm') return null; const b=mejorRM(p,o.ejercicio); return {b, pct:b?Math.min(1,b.rm/(+o.kg||1)):0}; }

async function logroBlob(p, o, mode='sticker', foto=null){

  const wrapTxt=(t,font,maxW)=>{ x.font=font; const w=t.split(' '), L=[]; let c=''; w.forEach(v=>{ const tt=(c+' '+v).trim(); if(x.measureText(tt).width>maxW && c){ L.push(c); c=v; } else c=tt; }); L.push(c); return L; };

  const body={to:String(p.email).trim(), tipo, nombre:p.nombre, marca:p.marca||'', sesion:c.tipo||'Sesión', pro:c.pro||'', fechaISO:fi, fecha:fi?fmtLong(parseISO(fi)):'', hora:c.hora||'', dur:sv?.dur||60,

function recoInit(){ S.reco=S.reco||{mus:[], eq:[], obj:'Hipertrofia', n:0, picks:[]}; if(!(S.reco.obj in RECO_OBJ)) S.reco.obj='Hipertrofia'; return S.reco; }

function recoOkEq(x){ const R=S.reco; if(R.eq.length) return R.eq.flatMap(e=>RECO_EQ[e]||[]).includes(x.q); return RECO_GYM.includes(x.q) || (x.q==='Peso Corporal' && RECO_GYM_CORP.test(fold(x.n))); }
function recoCands(mus){ const R=S.reco, ms=RECO_MUS[mus]||[], lib=(S.lib||[]).filter(x=>recoOkEq(x) && !RECO_NO.test(fold(x.n)));
  const out=[], seen=new Set(), add=x=>{ if(!seen.has(x.i)){ seen.add(x.i); out.push(x); } };
  (RECO_CLASIC[mus]||[]).forEach(pat=>{ const re=new RegExp(pat); const hits=lib.filter(x=>re.test(fold(x.n))).sort((a,b)=>(a.extra?0:1)-(b.extra?0:1) || a.n.length-b.n.length); if(hits.length) add(hits[0]); });
  lib.filter(x=>ms.includes(x.m)).map(x=>{ const f=fold(x.n); let sc=0; if(RECO_ES.test(f)) sc+=3; else sc-=4; if(esMulti(x)) sc+=2; if(f.length>34) sc-=1.5; if(R.obj==='Rehabilitación' && /maquina|polea/.test(fold(x.q))) sc+=1; return {x, sc:sc+Math.random()}; })

function escVals(def, r){ return def.items.map((it,i)=> it.k==='num' ? (r[i]===''||r[i]==null?null:+r[i]) : (r[i]==null||!it.o[r[i]]?null:it.o[r[i]][1])); }
function escScore(e){ const def=ESC[e&&e.esc]; if(!def||!e.r) return null; try{ return def.score(escVals(def,e.r), e.r, def); }catch(x){ return null; } }
function escFormHTML(key, r={}, pre='es'){ const def=ESC[key]; let sec='', h='';
  if(def.psfs){ const acts=(r.acts||[]).concat([{},{},{},{},{}]).slice(0,5);
    return acts.map((a,j)=>`<div class="trow"><input class="inp" id="${pre}-pa${j}" placeholder="Actividad ${j+1}${j?' (opcional)':''}${j===0?' · ej: subir escaleras':''}" value="${esc(a.a||'')}"><select class="inp" id="${pre}-pv${j}"><option value="">Puntaje 0–10</option>${[...Array(11).keys()].map(n=>`<option value="${n}" ${String(a.v)===String(n)?'selected':''}>${n}${n===0?' · no puedo':n===10?' · como antes':''}</option>`).join('')}</select></div>`).join(''); }
  def.items.forEach((it,i)=>{ if(it.sec && it.sec!==sec){ sec=it.sec; h+=`<div class="sec-sub">${esc(sec)}</div>`; }

window.guardarEvaluacion = async () => {

};

const SALTOS = ['CMJ','SJ','Abalakov','Drop jump'];
const hFromTv = ms => 9.81*Math.pow(ms/1000,2)/8*100;
const sayers = (h, kg) => 60.7*h + 45.3*kg - 2055;
function saltoCard(p){
  const log=(p.saltos||[]).slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))); const tipos=[...new Set(log.map(s=>s.tipo))];
  S.stTipo=SALTOS.includes(S.stTipo)?S.stTipo:'CMJ';
  const pal=['--acc','--blue','--orange','--pink','--green'];
  S.after.push(()=>{ if(!tipos.length) return; const labels=[...new Set(log.map(s=>s.fecha))].sort();
    mkChart('c-salto','line', labels.map(fmtShort), tipos.map((t,i)=>({label:t+' (cm)', data:labels.map(f=>{ const v=log.filter(s=>s.tipo===t&&s.fecha===f).map(s=>s.altura); return v.length?Math.max(...v):null; }), borderColor:cssv(pal[i%5]), backgroundColor:cssv(pal[i%5]), tension:.3, borderWidth:2.5, pointRadius:4, spanGaps:true}))); });
  const best=t=>Math.max(...log.filter(s=>s.tipo===t).map(s=>+s.altura));
  return `<section class="card stack"><div><div class="b">Saltos</div><div class="xs muted">Graba tu salto, marca el despegue y el aterrizaje, y listo.</div></div>
  ${tipos.length?`<div class="row" style="gap:6px;flex-wrap:wrap">${tipos.map(t=>`<span class="badge acc">${esc(t)} · mejor ${best(t).toFixed(1)} cm</span>`).join('')}</div><div class="chart"><canvas id="c-salto"></canvas></div>`:''}
  <div class="pills" style="flex-wrap:wrap">${SALTOS.map(t=>`<button class="pill ${S.stTipo===t?'on':''}" onclick="S.stTipo='${t}';keepScroll(render)">${t}</button>`).join('')}</div>
  <div class="grid2"><label class="btn pri" style="cursor:pointer">${ic('video','s')} Grabar salto<input type="file" accept="video/*" capture="environment" class="hidden" onchange="saltoVideo(event)"></label><label class="btn sec" style="cursor:pointer">${ic('upload','s')} Elegir video<input type="file" accept="video/*" class="hidden" onchange="saltoVideo(event)"></label></div>
  ${log.length?`<details><summary class="xs b muted" style="padding:4px 0">Ver registros (${log.length})</summary><div class="stack" style="gap:6px;margin-top:8px">${log.slice().reverse().map(s=>`<div class="row sm" style="gap:8px"><span class="grow">${fmtDate(s.fecha)} · ${esc(s.tipo)}${s.tv?` · ${s.tv} ms`:''}</span><b>${(+s.altura).toFixed(1)} cm</b><button class="ibtn red" style="width:30px;height:30px" onclick="borrarSalto(${s.id})">${ic('x','s')}</button></div>`).join('')}</div></details>`:''}</section>`;
}
