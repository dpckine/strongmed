const SALUD_TIPOS = ['steps','heartRate','restingHeartRate','bloodPressure','oxygenSaturation'];
const saludOn = () => { try{ return localStorage.getItem('sm_salud')==='1'; }catch(e){ return false; } };
window.conectarSalud = async () => { const H=healthP(); if(!H) return toast('Disponible en la app StrongMed para Android','err');
  try{ const a=await H.isAvailable(); if(!a || !a.available){ toast('Instala o actualiza Health Connect desde Play Store','err'); return; }
    const r=await H.requestAuthorization({read:SALUD_TIPOS, write:[]}); if(!(r && r.readAuthorized || []).length){ toast('No se dio permiso para leer los datos','err'); return; }
    try{ localStorage.setItem('sm_salud','1'); }catch(e){} toast('App de salud conectada'); await sincSalud(true); keepScroll(render); }
  catch(e){ console.warn(e); toast('No se pudo conectar: '+(e.message||e),'err'); } };
window.desconectarSalud = () => { try{ localStorage.removeItem('sm_salud'); }catch(e){} toast('Se dejó de leer la app de salud'); keepScroll(render); };
function setPasosDiaSalud(p, f, n){ p.diarios=p.diarios||[]; const total=pasosDia(p,f); if(n<=total) return false;
  const solo=p.diarios.find(d=>toISO(d.fecha)===f && !isTraining(d)), otros=total-(solo?(+solo.pasos||0):0);
  if(solo) solo.pasos=n-otros; else p.diarios.push({id:uid(), fecha:f, pasos:n-otros, fuente:'salud'}); return true; }
async function sincSalud(forzar){ const H=healthP(), p=me(); if(!H || !p || S.role!=='pat' || !saludOn()) return false;
  if(!forzar && S._saludTs && Date.now()-S._saludTs<10*60e3) return false; S._saludTs=Date.now();
  const fin=new Date(), ini=new Date(); ini.setDate(ini.getDate()-6); ini.setHours(0,0,0,0); let cambio=false;
  const m0=metaPasos(p), antes0=pasosDia(p,todayISO());
  try{ const r=await H.queryAggregated({dataType:'steps', startDate:ini.toISOString(), endDate:fin.toISOString(), bucket:'day', aggregation:'sum'});
    ((r && r.samples) || []).forEach(s=>{ const f=iso(new Date(s.startDate)), n=Math.round(+s.value||0); if(n>0 && setPasosDiaSalud(p,f,n)) cambio=true; }); }catch(e){ console.warn('pasos salud', e); }
  const ult = async tipo => { try{ const r=await H.readSamples({dataType:tipo, startDate:new Date(Date.now()-30*864e5).toISOString(), endDate:fin.toISOString(), limit:1, ascending:false}); return ((r && r.samples) || [])[0] || null; }catch(e){ return null; } };
  const [fc, fcr, pa, sat] = await Promise.all(['heartRate','restingHeartRate','bloodPressure','oxygenSaturation'].map(ult));
  const sv={}, ts=s=>Date.parse(s.endDate||s.startDate)||Date.now();
  const put=(k,s,v)=>{ if(s && v!=null && !isNaN(v) && v>0) sv[k]={v:Math.round(v*10)/10, ts:ts(s), src:String(s.sourceName||'').slice(0,40)}; };
  put('fc',fc,fc&&+fc.value); put('fcr',fcr,fcr&&+fcr.value); put('spo2',sat,sat&&(+sat.value<=1 ? +sat.value*100 : +sat.value));
  if(pa && +pa.systolic) sv.pa={sis:Math.round(+pa.systolic), dia:Math.round(+pa.diastolic), ts:ts(pa), src:String(pa.sourceName||'').slice(0,40)};
  const prev=JSON.stringify({...(p.salud||{}), sinc:0}); p.salud={...(p.salud||{}), ...sv, sinc:Date.now()};
  if(cambio || JSON.stringify({...p.salud, sinc:0})!==prev){ await save(p);
    if(antes0<m0 && pasosDia(p,todayISO())>=m0) toast('¡Meta de pasos cumplida! Hoy cuenta como día activo 🎉');
    if(['hoy','progreso'].includes(S.patTab)) softRender(); return true; }
  return false; }
window.sincSalud = sincSalud;
// La app web no lee apps de salud (solo el contador de pasos propio); ya no se sincroniza al volver a la app.
/* Conexión automática: en la app Android pide el permiso de Health Connect la primera vez; en la app web ofrece una sola vez
   instalar la app Android (Android) o el Atajo de Salud (iPhone), y siempre trae lo que haya enviado el Atajo. */
const esAndroid = () => /Android/i.test(navigator.userAgent);
const esIOS = () => /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const APK_URL = 'https://github.com/dpckine/strongmed/releases/latest/download/StrongMed.apk';
const SALUD_API = 'https://strongmed.vercel.app/api/salud';
const ATAJO_URL = '';   // enlace de iCloud del Atajo "StrongMed Salud" (cuando exista, se ofrece también en iPhone)
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } }, lsSet = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
async function autoSalud(){ if(S.role!=='pat') return;
  if(healthP()){ if(saludOn()) return sincSalud(true); if(!lsGet('sm_salud_pedido')){ lsSet('sm_salud_pedido','1'); return conectarSalud(); } return; }
  await sincAtajo(true);
  if(!lsGet('sm_oferta_salud') && (esAndroid() || (esIOS() && ATAJO_URL))){ lsSet('sm_oferta_salud','1'); setTimeout(ofertaSalud, 2500); } }
window.ofertaSalud = (intento=0) => { if(S.role!=='pat') return; if($('#sheet')){ if(intento<8) setTimeout(()=>ofertaSalud(intento+1), 5000); return; }
  sheet(`<h2 class="disp h2">Conecta tu app de salud</h2><div class="stack" style="margin-top:12px">${esAndroid()
    ? `<p class="sm">Instala la app StrongMed para Android y tus <b>pasos, pulso, presión y saturación</b> se registran solos desde Samsung Health, Google Fit o tu reloj. Entras con tu mismo RUT y PIN.</p><a class="btn pri block" href="${APK_URL}" onclick="setTimeout(closeSheet,400)">${ic('steps','s')} Descargar app StrongMed</a><p class="xs muted">Android te pedirá permitir la instalación de esta app. Es la app oficial de StrongMed.</p>`
    : `<p class="sm">Con el Atajo "StrongMed Salud", tus <b>pasos, pulso, presión y saturación</b> de la app Salud del iPhone llegan solos a StrongMed.</p><button class="btn pri block" onclick="conectarAtajo()">${ic('steps','s')} Conectar Salud de iPhone</button>`}
    <button class="btn ghost block" onclick="closeSheet()">Ahora no</button></div>`); };
window.conectarAtajo = async () => { const t=await tokenSM(); if(!t) return toast('Cierra sesión y vuelve a entrar para conectar','err');
  try{ const r=await fetch(SALUD_API, {method:'POST', headers:{'content-type':'application/json', authorization:'Bearer '+t}, body:JSON.stringify({accion:'codigo'})}); const j=await r.json(); if(!j.ok) throw 0;
    try{ await navigator.clipboard.writeText(j.codigo); }catch(e){}
    sheet(`<h2 class="disp h2">Tu código para el Atajo</h2><div class="stack" style="margin-top:12px"><p class="sm">Ya quedó copiado. Al agregar el Atajo, pégalo cuando te lo pida.</p>
      <div class="card tight" style="font-family:monospace;font-size:20px;text-align:center;user-select:all;-webkit-user-select:all">${esc(j.codigo)}</div>
      ${ATAJO_URL?`<a class="btn pri block" href="${ATAJO_URL}">Agregar el Atajo</a>`:''}
      <p class="xs muted">Después, en Atajos → Automatización, crea una automatización diaria (por ejemplo a las 21:00) que ejecute "StrongMed Salud" sin preguntar. Si pides un código nuevo, el anterior deja de funcionar.</p>
      <button class="btn ghost block" onclick="closeSheet()">Listo</button></div>`); }
  catch(e){ toast('No se pudo crear el código. Intenta más tarde.','err'); } };
async function sincAtajo(forzar){ const p=me(); if(!p || !S.fb || S.role!=='pat') return false;
  if(!forzar && S._atajoTs && Date.now()-S._atajoTs<10*60e3) return false; S._atajoTs=Date.now();
  try{ const s=await S.fb.getDoc(S.fb.doc(S.dbs.sm,'salud',normRut(p.rut))); if(!s.exists()) return false; const x=s.data()||{}; if(!x.recibido) return false;
    let cambio=false; Object.entries(x.pasos||{}).forEach(([f,n])=>{ if(+n>0 && setPasosDiaSalud(p,f,Math.round(+n))) cambio=true; });
    const sv={}; ['fc','fcr','pa','spo2'].forEach(k=>{ if(x[k] && x[k].ts && (!p.salud || !p.salud[k] || p.salud[k].ts<x[k].ts)) sv[k]=x[k]; });
    if(Object.keys(sv).length){ p.salud={...(p.salud||{}), ...sv, sinc:x.recibido}; cambio=true; }
    if(cambio){ await save(p); if(['hoy','progreso'].includes(S.patTab)) softRender(); } return cambio; }
  catch(e){ console.warn('salud atajo', e); return false; } }
const horaCorta = ts => new Date(ts).toLocaleString('es-CL', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
function vitalesCard(p){ const s=p.salud||{}; if(!s.fc && !s.fcr && !s.pa && !s.spo2) return '';
  const it=(titulo,x,valor,u)=> x ? `<div class="stat"><b>${valor}<small class="muted" style="font-size:13px"> ${u}</small></b><span>${titulo} · ${horaCorta(x.ts)}</span></div>` : '';
  return `<section class="card"><div class="row between"><span class="b">Datos de la app de salud</span><span class="xs muted">${s.sinc?'Leído '+horaCorta(s.sinc):''}</span></div>
    <div class="grid2" style="margin-top:8px">${it('Pulso',s.fc,s.fc&&s.fc.v,'lpm')}${it('Pulso en reposo',s.fcr,s.fcr&&s.fcr.v,'lpm')}${it('Presión',s.pa,s.pa&&`${s.pa.sis}/${s.pa.dia}`,'mmHg')}${it('Saturación',s.spo2,s.spo2&&s.spo2.v,'%')}</div>
    <div class="xs muted" style="margin-top:6px">Última medición registrada en el teléfono o el reloj. No reemplaza una evaluación clínica.</div></section>`; }

/* ================= PASOS: meta, anillo y contador del teléfono ================= */
const pasosDia = (p, d) => +((p.diarios||[]).filter(x=>toISO(x.fecha)===d).reduce((s,x)=>s+(+x.pasos||0),0));
const metaPasos = p => +p.metaPasos || 8000;
function setPasosHoy(p, n){ p.diarios=p.diarios||[]; const t=p.diarios.find(d=>toISO(d.fecha)===todayISO() && !isTraining(d)); if(t) t.pasos=n; else p.diarios.push({id:uid(), fecha:todayISO(), pasos:n}); }
function sumarPasosHoy(p, n){ const cur=pasosDiaSolo(p); setPasosHoy(p, cur+Math.round(n)); }
const pasosDiaSolo = p => +(((p.diarios||[]).find(d=>toISO(d.fecha)===todayISO() && !isTraining(d))||{}).pasos||0);
function stepsCard(p){
  const n=pasosDia(p,todayISO()), m=metaPasos(p), pct=Math.min(1,n/m), km=(n*0.75/1000).toFixed(2), ws=weekStart(new Date());
  const r=70, c=2*Math.PI*r;
  let week=''; for(let i=0;i<7;i++){ const d=new Date(ws); d.setDate(d.getDate()+i); const s=iso(d), v=pasosDia(p,s), ok=v>=m, fut=s>todayISO();
    week+=`<div class="wk ${ok?'ok':''} ${fut?'fut':''}"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" class="bg"/><circle cx="15" cy="15" r="12" class="fg" stroke-dasharray="${2*Math.PI*12}" stroke-dashoffset="${2*Math.PI*12*(1-Math.min(1,v/m))}" transform="rotate(-90 15 15)"/></svg><span>${'DLMMJVS'[d.getDay()]}</span></div>`; }
  const ped=S.ped&&S.ped.on;
  return `<section class="card stack stepscard"><div class="row" style="gap:18px;align-items:center">
    <div class="sring"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="${r}" class="bg"/><circle cx="85" cy="85" r="${r}" class="fg" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 85 85)"/></svg><div><b id="st-n">${n.toLocaleString('es-CL')}</b><small>de ${m.toLocaleString('es-CL')}</small></div></div>
    <div class="grow"><div class="eyebrow">Pasos de hoy</div><div class="b" style="margin-top:4px">${n>=m?'¡Meta cumplida! 🎉':`Te faltan ${(m-n).toLocaleString('es-CL')}`}</div><div class="xs muted">${km} km aprox.</div>
    <div class="week7">${week}</div></div></div>
    ${ped&&S.ped.auto?`<div class="aviso acc"><span class="ico">${ic('steps')}</span><div class="grow"><div class="b">Conteo automático activo</div><div class="xs muted">Cuenta mientras la app esté abierta y se guarda solo cada minuto.</div></div><button class="btn sec sm" onclick="pedAutoOff()">Desactivar</button></div>`
     :ped?`<div class="aviso acc"><span class="ico">${ic('steps')}</span><div class="grow"><div class="b">Contando pasos…</div><div class="xs muted">Mantén la app abierta y el teléfono contigo. <b id="ped-n">${S.ped.count}</b> pasos</div></div><button class="btn pri sm" onclick="pararPasos()">Listo</button></div>`
      :`<div class="grid2"><button class="btn sec sm" onclick="contarPasos()">${ic('steps','s')} Contar con el teléfono</button><button class="btn sec sm" onclick="sheetPasos()">${ic('edit','s')} Anotar pasos</button></div><button class="btn ghost sm block" onclick="sheetPedAuto()">${ic('steps','s')} Contar pasos automáticamente</button>`}</section>`;
}
window.sheetPasos = () => { const p=me(); sheet(`<h2 class="disp h2">Pasos de hoy</h2><div class="stack" style="margin-top:14px"><label class="field"><span class="lbl">Total de pasos de hoy (según tu reloj o app)</span><input class="inp" id="sp-n" inputmode="numeric" value="${pasosDia(p,todayISO())||''}"></label><label class="field"><span class="lbl">Mi meta diaria</span><input class="inp" id="sp-m" inputmode="numeric" value="${metaPasos(p)}"></label><button class="btn pri block" onclick="guardarPasosSheet()">Guardar</button></div>`); };
window.guardarPasosSheet = async () => { const p=me(), n=parseInt(val('sp-n')), m=parseInt(val('sp-m')); if(m>0) p.metaPasos=m;
  if(n>=0){ const otros=pasosDia(p,todayISO())-pasosDiaSolo(p); setPasosHoy(p, Math.max(0,n-otros)); } await save(p); closeSheet(); if(pasosDia(p,todayISO())>=metaPasos(p)){ celebrar(); toast('¡Meta de pasos cumplida! Hoy cuenta como día activo 🎉'); } else toast('Pasos guardados'); keepScroll(render); };
let wakeLock=null; async function keepAwake(on){ try{ if(on && 'wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); } else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && ((S.ped&&S.ped.on)||(S.gps&&!S.gps.paused))) keepAwake(true); });
function onMotion(e){ const g=e.accelerationIncludingGravity; if(!g) return; const a=Math.sqrt((g.x||0)**2+(g.y||0)**2+(g.z||0)**2); const P=S.ped; P.avg = P.avg ? P.avg*0.92 + a*0.08 : a; const now=Date.now();
  if(a - P.avg > 1.6 && now - (P.last||0) > 320){ P.count++; P.last=now; const el=$('#ped-n'); if(el) el.textContent=P.count; } }
window.contarPasos = async () => { try{ if(typeof DeviceMotionEvent!=='undefined' && DeviceMotionEvent.requestPermission){ const r=await DeviceMotionEvent.requestPermission(); if(r!=='granted') return toast('Necesitamos permiso de movimiento para contar pasos','err'); } }catch(e){}
  if(typeof DeviceMotionEvent==='undefined') return toast('Este dispositivo no tiene sensor de movimiento','err');
  S.ped={on:true, count:0}; window.addEventListener('devicemotion', onMotion); keepAwake(true); keepScroll(render); };
window.pararPasos = async () => { window.removeEventListener('devicemotion', onMotion); keepAwake(false); const n=S.ped.count; S.ped=null; if(n>0){ const p=me(); sumarPasosHoy(p,n); await save(p); toast(`+${n} pasos`); } keepScroll(render); };

/* ---- conteo automático de pasos (con consentimiento): cuenta mientras la app está abierta y guarda cada minuto ---- */
const pedAuto = () => { try{ return localStorage.getItem('sm_ped_auto')==='1'; }catch(e){ return false; } };
window.sheetPedAuto = () => sheet(`<h2 class="disp h2">Contar pasos automáticamente</h2><div class="stack" style="margin-top:12px">
  <p class="sm">Si aceptas, cada vez que abras StrongMed el teléfono contará tus pasos con su sensor de movimiento y los irá sumando solo a tu registro diario. Cuando llegues a tu meta, ese día cuenta como <b>día activo</b> en tu adherencia.</p>
  <div class="note">${ic('info','s')}<span>Los celulares no permiten que una app web cuente pasos con la pantalla apagada o cerrada. Para el resto del día, anota el total que marque tu reloj o tu app de salud (Google Fit, Samsung Health, Salud de iPhone) con <b>Anotar pasos</b>.</span></div>
  <p class="xs muted">Solo se guarda el número de pasos por día. Puedes desactivarlo cuando quieras.</p>
  <button class="btn pri block" onclick="pedAutoOn()">Acepto, activar</button><button class="btn ghost block" onclick="closeSheet()">Ahora no</button></div>`);
window.pedAutoOn = async () => { try{ localStorage.setItem('sm_ped_auto','1'); }catch(e){}
  try{ if(typeof DeviceMotionEvent!=='undefined' && DeviceMotionEvent.requestPermission){ const r=await DeviceMotionEvent.requestPermission(); if(r!=='granted'){ closeSheet(); return toast('Necesitamos permiso de movimiento para contar pasos','err'); } } }catch(e){}
  closeSheet(); pedAutoStart(true); toast('Conteo automático activado'); keepScroll(render); };
function pedAutoStart(ok){ if(S.role!=='pat' || (S.ped&&S.ped.on) || typeof DeviceMotionEvent==='undefined') return;
  const start=()=>{ if(S.ped&&S.ped.on) return; S.ped={on:true, count:0, auto:true}; window.addEventListener('devicemotion', onMotion); clearInterval(S.pedTimer); S.pedTimer=setInterval(pedFlush, 60000); if(S.patTab==='hoy') softRender(); };
  if(!ok && DeviceMotionEvent.requestPermission){ const go=async()=>{ try{ if(await DeviceMotionEvent.requestPermission()==='granted') start(); }catch(e){} }; document.addEventListener('touchend', go, {once:true}); return; }
  start(); }
async function pedFlush(){ const P=S.ped; if(!P || !P.on || !P.auto || !P.count || S.role!=='pat') return; const n=P.count; P.count=0; const p=me(); if(!p) return;
  const m=metaPasos(p), antes=pasosDia(p,todayISO()); sumarPasosHoy(p,n); await save(p);
  if(antes<m && pasosDia(p,todayISO())>=m){ celebrar(); toast('¡Meta de pasos cumplida! Hoy cuenta como día activo 🎉'); } if(S.patTab==='hoy') softRender(); }
window.pedAutoOff = async () => { await pedFlush(); clearInterval(S.pedTimer); window.removeEventListener('devicemotion', onMotion); S.ped=null; try{ localStorage.removeItem('sm_ped_auto'); }catch(e){} toast('Conteo automático desactivado'); keepScroll(render); };
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') pedFlush(); });
window.addEventListener('pagehide', ()=>{ pedFlush(); });

/* ================= MIS MEDIDAS (antropometría por la persona) ================= */
const lastMedida = p => (p.medidas||[]).slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))).pop();
const edadDe = p => { if(p.fechaNac){ const d=parseISO(p.fechaNac), n=new Date(); let e=n.getFullYear()-d.getFullYear(); if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate())) e--; return e; } return p.edad||''; };
function medidasCard(p, editable=true){ const m=lastMedida(p)||{}, imc=m.peso&&m.talla?(m.peso/Math.pow(m.talla/100,2)):null;
  if(editable) S.after.push(()=>{ const ms=(p.medidas||[]).filter(x=>x.peso).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))); if(ms.length>1) mkChart('c-peso','line', ms.map(x=>fmtShort(x.fecha)), [{label:'Peso (kg)', data:ms.map(x=>+x.peso), borderColor:cssv('--acc'), backgroundColor:cssv('--acc'), tension:.3, borderWidth:2.5, pointRadius:3}]); });
  return `<section class="card stack"><div class="row between"><span class="b">${editable?'Mis medidas':'Medidas registradas por la persona'}</span>${editable?`<button class="btn ghost sm" onclick="sheetMedidas()">${ic('plus','s')} Actualizar</button>`:''}</div>
  ${m.fecha?`<div class="grid4" style="gap:8px">${[['Peso',m.peso,'kg'],['Talla',m.talla,'cm'],['IMC',imc?imc.toFixed(1):'',''],['Cintura',m.cintura,'cm'],['% grasa',m.grasa,'%']].filter(x=>x[1]).map(([l,v,u])=>`<div class="stat"><b style="font-size:26px">${esc(v)}<small class="muted" style="font-size:14px"> ${u}</small></b><span>${l}</span></div>`).join('')}</div><div class="xs muted">Actualizado ${fmtDate(m.fecha)}${edadDe(p)?` · ${edadDe(p)} años`:''}${p.sexo?` · ${esc(p.sexo)}`:''}</div>${editable&&(p.medidas||[]).filter(x=>x.peso).length>1?`<div class="chart" style="height:150px"><canvas id="c-peso"></canvas></div>`:''}`:`<div class="xs muted">${editable?'Registra tu peso, talla y otras medidas para ver tu evolución.':'Aún no registra medidas.'}</div>`}</section>`; }
window.sheetMedidas = () => { const p=me(), m=lastMedida(p)||{};
  sheet(`<h2 class="disp h2">Mis medidas</h2><div class="stack" style="margin-top:14px">
  <div class="grid2"><label class="field"><span class="lbl">Peso (kg)</span><input class="inp" id="md-p" inputmode="decimal" value="${esc(m.peso||'')}"></label><label class="field"><span class="lbl">Talla (cm)</span><input class="inp" id="md-t" inputmode="decimal" value="${esc(m.talla||'')}"></label></div>
  <div class="grid2"><label class="field"><span class="lbl">Cintura (cm)</span><input class="inp" id="md-c" inputmode="decimal" placeholder="Opcional" value=""></label><label class="field"><span class="lbl">% grasa</span><input class="inp" id="md-g" inputmode="decimal" placeholder="Opcional" value=""></label></div>
  <div class="grid2"><label class="field"><span class="lbl">Fecha de nacimiento</span><input class="inp" type="date" id="md-n" value="${esc(p.fechaNac||'')}"></label><label class="field"><span class="lbl">Sexo</span><select class="inp" id="md-s">${['','Femenino','Masculino','Otro'].map(x=>`<option ${p.sexo===x?'selected':''}>${x}</option>`).join('')}</select></label></div>
  <label class="field"><span class="lbl">Meta de pasos diarios</span><input class="inp" id="md-m" inputmode="numeric" value="${metaPasos(p)}"></label>
  <button class="btn pri block" onclick="guardarMedidas()">Guardar</button></div>`); };

/* ================= ACTIVIDADES CON GPS (trote, bicicleta, caminata) ================= */
const GPS_T = {Trote:{v:'trotas', pace:true, max:9, zancada:1.1}, Caminata:{v:'caminas', pace:true, max:4, zancada:0.75}, Bicicleta:{v:'pedaleas', pace:false, max:25}};
const hav = (a,b) => { const R=6371000, t=x=>x*Math.PI/180, dl=t(b[0]-a[0]), dn=t(b[1]-a[1]); const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
const gpsElapsed = g => (g.acc||0) + (g.paused||!g.since ? 0 : Date.now()-g.since);
const fmtPace = (ms, m) => { if(m<30) return '--:--'; const sPerKm=ms/1000/(m/1000); return `${Math.floor(sPerKm/60)}:${pad(Math.round(sPerKm%60))}`; };
const fmtSpeed = (ms, m) => ms>0 ? (m/1000/(ms/3600000)).toFixed(1) : '0.0';
const gpsKey = () => 'sm_gps_'+S.me;
function persistGps(){ try{ S.gps ? localStorage.setItem(gpsKey(), JSON.stringify(S.gps)) : localStorage.removeItem(gpsKey()); }catch(e){} }
function restoreGps(){ try{ const g=JSON.parse(localStorage.getItem(gpsKey())); if(g && Date.now()-g.t0 < 8*3600e3){ S.gps=g; g.paused=true; g.since=null; } }catch(e){} }
/* mapas gratuitos y sin clave (si uno falla se usa el siguiente). El GPS es el del propio teléfono: gratis. */
const TILES=[['https://tile.openstreetmap.org/{z}/{x}/{y}.png','© OpenStreetMap','abc'],
  ['https://tile.openstreetmap.de/{z}/{x}/{y}.png','© OpenStreetMap','abc'],
  ['https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png','© OpenStreetMap · HOT','abc']];
function baseLayer(map, i=0){ const [u,att,sub]=TILES[i]; let errs=0; const l=L.tileLayer(u,{maxZoom:19, subdomains:sub, attribution:att}).addTo(map);
  l.on('tileerror', ()=>{ if(++errs===3 && TILES[i+1]){ map.removeLayer(l); baseLayer(map, i+1); } }); return l; }
let gpsWatch=null, gpsMap=null, gpsLine=null, gpsDot=null;
async function loadLeaflet(){ if(window.L) return true; return new Promise(res=>{ const l=document.createElement('link'); l.rel='stylesheet'; l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(l);
  const s=document.createElement('script'); s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload=()=>res(true); s.onerror=()=>res(false); document.head.appendChild(s); }); }
window.iniciarGps = async tipo => {
  if(!('geolocation' in navigator)) return toast('Este teléfono no permite usar el GPS desde el navegador','err');
  if(S.gps && !confirm('Tienes una actividad en curso. ¿Descartarla y empezar otra?')) { go('gps'); return; }
  S.gps={tipo, t0:Date.now(), since:Date.now(), acc:0, paused:false, pts:[], dist:0}; persistGps(); watchGps(); keepAwake(true); S.patTab='gps'; render(); scrollTo({top:0}); };
function watchGps(){ if(gpsWatch!=null) navigator.geolocation.clearWatch(gpsWatch);
  gpsWatch=navigator.geolocation.watchPosition(pos=>{ const g=S.gps; if(!g) return; const c=pos.coords, pt=[+c.latitude.toFixed(6), +c.longitude.toFixed(6), pos.timestamp||Date.now()];
    S.gpsFix={acc:Math.round(c.accuracy)}; const fx=$('#gps-acc'); if(fx) fx.textContent=`GPS ±${S.gpsFix.acc} m`; const wk=$('#gps-weak'); if(wk) wk.classList.toggle('hidden', c.accuracy<=40);
    if(g.paused || c.accuracy>40) return; const last=g.pts[g.pts.length-1];
    if(last){ const d=hav(last,pt), dt=(pt[2]-last[2])/1000; if(d<4) return; if(dt>0 && d/dt>GPS_T[g.tipo].max*1.6) return; g.dist+=d; }

function gpsDraw(){ const g=S.gps; if(!g) return; const ms=gpsElapsed(g);
  const set=(id,v)=>{ const e=$(id); if(e) e.textContent=v; };
  set('#gps-t', fmtClock(ms/1000)); set('#gps-d', (g.dist/1000).toFixed(2)); set('#gps-p', GPS_T[g.tipo].pace?fmtPace(ms,g.dist):fmtSpeed(ms,g.dist));
  if(gpsMap && window.L && g.pts.length){ const ll=g.pts.map(p=>[p[0],p[1]]); gpsLine.setLatLngs(ll); gpsDot.setLatLng(ll[ll.length-1]); gpsMap.panTo(ll[ll.length-1]); } }

async function initGpsMap(){ const el=$('#gps-map'); if(!el) return; if(!(await loadLeaflet())){ el.innerHTML='<div class="empty" style="padding-top:90px">Mapa no disponible sin conexión. Tu recorrido se sigue registrando.</div>'; return; }
  gpsMap=L.map(el,{zoomControl:false, attributionControl:true}); baseLayer(gpsMap);
  const ll=S.gps.pts.map(p=>[p[0],p[1]]); gpsLine=L.polyline(ll,{color:'#ccff33', weight:6, opacity:.95}).addTo(gpsMap); gpsDot=L.circleMarker(ll[ll.length-1]||[-36.827,-73.050],{radius:8, color:'#fff', weight:3, fillColor:'#ccff33', fillOpacity:1}).addTo(gpsMap);
  gpsMap.setView(ll[ll.length-1]||[-36.827,-73.050], 16);
  if(!ll.length) navigator.geolocation.getCurrentPosition(p=>{ gpsMap.setView([p.coords.latitude,p.coords.longitude],16); gpsDot.setLatLng([p.coords.latitude,p.coords.longitude]); }, ()=>{}, {enableHighAccuracy:true}); }
function vGps(p){

window.gpsPausa = () => { const g=S.gps; g.acc=gpsElapsed(g); g.paused=true; g.since=null; persistGps(); keepAwake(false); render(); };
window.gpsReanudar = () => { const g=S.gps; g.paused=false; g.since=Date.now(); if(gpsWatch==null) watchGps(); persistGps(); keepAwake(true); render(); };
['sheetActividad','iniciarGps'].forEach(n=>{ const f=window[n]; window[n]=(...a)=>{ const p=me(); if(p && S.role==='pat' && perfilOf(p)==='rehabilitacion') return wellnessAntes(()=>f(...a), 'antes de registrar'); return f(...a); }; });
window.gpsDescartar = () => { if(!confirm('¿Descartar esta actividad? No se guardará.')) return; stopGps(); S.gps=null; persistGps(); go('hoy'); };
function stopGps(){ if(gpsWatch!=null) navigator.geolocation.clearWatch(gpsWatch); gpsWatch=null; keepAwake(false); gpsMap=null; }
function simplify(pts, max=400){ const ll=pts.map(p=>[+p[0].toFixed(5), +p[1].toFixed(5)]); if(ll.length<=max) return ll; const k=Math.ceil(ll.length/max); return ll.filter((_,i)=>i%k===0 || i===ll.length-1); }

/* ruta en miniatura (sin internet) */
function routePath(ruta, w, h, padd=10){ if(!ruta||ruta.length<2) return null; const lat0=ruta[0][0]*Math.PI/180, xs=ruta.map(p=>p[1]*Math.cos(lat0)), ys=ruta.map(p=>-p[0]);
  const mnx=Math.min(...xs), mxx=Math.max(...xs), mny=Math.min(...ys), mxy=Math.max(...ys), sc=Math.min((w-2*padd)/((mxx-mnx)||1e-9),(h-2*padd)/((mxy-mny)||1e-9)), ox=(w-(mxx-mnx)*sc)/2, oy=(h-(mxy-mny)*sc)/2;
  return xs.map((x,i)=>[ox+(x-mnx)*sc, oy+(ys[i]-mny)*sc]); }
function routeSvg(ruta, w=120, h=80){ const pp=routePath(ruta,w,h,8); if(!pp) return ''; return `<svg class="rthumb" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><polyline points="${pp.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pp[0][0]}" cy="${pp[0][1]}" r="3.5" fill="var(--green)"/><circle cx="${pp[pp.length-1][0]}" cy="${pp[pp.length-1][1]}" r="3.5" fill="var(--red)"/></svg>`; }
const gmapsUrl = d => { const r=d.ruta||[]; if(r.length<2) return '#'; const n=Math.min(8, r.length-2), wp=[]; for(let i=1;i<=n;i++) wp.push(r[Math.round(i*(r.length-1)/(n+1))].join(','));
  return `https://www.google.com/maps/dir/?api=1&origin=${r[0].join(',')}&destination=${r[r.length-1].join(',')}${wp.length?`&waypoints=${encodeURIComponent(wp.join('|'))}`:''}&travelmode=${d.tipoActividad==='Bicicleta'?'bicycling':'walking'}`; };
window.verRuta = async id => { const d=(me().diarios||[]).find(x=>String(x.id)===String(id)); if(!d) return;
  sheet(`<h2 class="disp h2">${esc(d.nombreSesion)}</h2><p class="muted sm">${fmtDate(d.fecha)} · ${d.distancia} km · ${d.duracion} min${d.ritmo?` · ${d.ritmo} min/km`:` · ${d.velocidad} km/h`}</p><div class="gpsmap" id="rt-map" style="margin-top:12px;height:300px">${routeSvg(d.ruta,320,300)}</div><div class="grid2" style="margin-top:12px"><a class="btn sec" href="${gmapsUrl(d)}" target="_blank" rel="noopener">${ic('pin','s')} Google Maps</a><button class="btn pri" onclick="closeSheet();compartir(${q(id)})">${ic('upload','s')} Compartir</button></div>`);

async function kiaAnswer(text){
  const f=kiaFold(text), qt=kiaTok(text);
  if(/^(hola|buenas|buenos|holi|hey)\b/.test(f) && qt.length<=1) return {r:'¡Hola! Soy KIN IA. Pregúntame sobre entrenamiento, series y repeticiones, descanso, cargas, cardio, pasos o ejercicios para un músculo.'};
  if(/ejercicio|rutina|trabajar|entrenar|fortalecer/.test(f)){ const m=KIA_MUS.find(([re])=>re.test(f));
    if(m){ await loadLib(); const ex=(S.lib||[]).filter(x=>m[1].includes(x.m)); if(ex.length){ const pick=ex.filter(x=>/barra|mancuerna|peso corporal|polea/i.test(x.q)).slice(0,6); const list=(pick.length?pick:ex).slice(0,6);
      return {r:`Algunos ejercicios para ${m[1].map(x=>x.toLowerCase()).join(', ')}:`, ex:list.map(x=>({i:x.i, n:x.n, q:x.q})), extra:'Prioriza primero los multiarticulares y luego los de aislamiento. Tu kinesiólogo puede armarte la rutina.'}; } } }
  if(!qt.length) return {r:KIA_NO, no:true};
  const best=kiaDocs().map(d=>({d, ...kiaScore(qt,d)})).filter(x=>x.strong>0).sort((a,b)=>(b.s-a.s) || (b.d.own?1:0)-(a.d.own?1:0));
  const need = qt.length<=2 ? 3 : Math.max(4, Math.ceil(qt.length*1.2));
  if(best.length && best[0].s>=need) return {r:best[0].d.r, t:best[0].d.t, kine:best[0].d.kine, own:best[0].d.own};
  // apuntes cargados por el equipo
  const notes=(S.faq||[]).filter(x=>x.tipo==='texto').flatMap(x=>String(x.respuesta||'').split(/\n+|(?<=[.!?])\s+/).map(sn=>({sn:sn.trim(), from:x.pregunta}))).filter(x=>x.sn.length>25);
  const hits=notes.map(n=>{ const tk=new Set(kiaTok(n.sn)); const c=qt.filter(w=>tk.has(w)).length; return {...n, c}; }).filter(n=>n.c>=Math.max(2, Math.ceil(qt.length*0.5))).sort((a,b)=>b.c-a.c);
  if(hits.length) return {r:hits.slice(0,2).map(h=>h.sn).join('\n'), t:`De los apuntes: ${hits[0].from}`, own:true};
  if(best.length && best[0].s>=3 && best[0].strong>=2) return {r:best[0].d.r, t:best[0].d.t, kine:best[0].d.kine};
  return {r:KIA_NO, no:true};
}

S.navStack = [];
const navSnap = () => S.role==='pat' ? {r:'pat', t:S.patTab} : S.role==='pro' ? {r:'pro', t:S.proTab, a:S.proArg, s:S.pSeg} : null;
const navPush = () => { const c=navSnap(); if(!c) return; const l=S.navStack[S.navStack.length-1]; if(!l || JSON.stringify(l)!==JSON.stringify(c)) S.navStack.push(c); if(S.navStack.length>30) S.navStack.shift(); };
let navSilencio=false;
const _go=window.go, _pgo=window.pgo;
window.go = tab => { if(!navSilencio && tab!==S.patTab) navPush(); _go(tab); };
window.pgo = (t, arg) => { if(!navSilencio && (t!==S.proTab || arg!==undefined)) navPush(); _pgo(t, arg); };
/* el botón Atrás: cierra la ventana abierta, vuelve a la pantalla anterior, y recién en Inicio pide confirmar para salir */
let salirT=0;
function navAtras(){
  if($('#sheet')){ closeSheet(); return true; }
  if(!S.role){ if(['reservar','signup','voucher'].includes(S.loginMode)){ S.loginMode='pat'; render(); return true; } return false; }
  while(S.navStack.length){ const p=S.navStack.pop(); if(p.r!==S.role) continue;
    navSilencio=true; try{ if(p.r==='pat') go(p.t); else { S.pSeg=p.s||S.pSeg; pgo(p.t, p.a); } } finally{ navSilencio=false; } return true; }
  const home = S.role==='pat' ? 'hoy' : 'inicio';
  if((S.role==='pat'?S.patTab:S.proTab)!==home){ navSilencio=true; try{ S.role==='pat'?go(home):pgo(home); } finally{ navSilencio=false; } return true; }
  return false; }
function navInit(){ try{ history.replaceState({sm:'base'}, ''); history.pushState({sm:'app'}, ''); }catch(e){} }
window.addEventListener('popstate', e=>{
  if(e.state && e.state.sm==='app') return;
  if(navAtras()){ history.pushState({sm:'app'}, ''); return; }
  if(Date.now()-salirT < 2200){ history.back(); return; }   // segundo Atrás: sale de la app
  salirT=Date.now(); toast('Presiona Atrás otra vez para salir'); history.pushState({sm:'app'}, ''); });
navInit();

/* deslizar el dedo a la izquierda o derecha para cambiar de pestaña */
const NO_SWIPE = '.pills,.dchips,.gpsmap,.leaflet-container,canvas,.chart,input,textarea,select,.dgrid,.mgrid,.jvwrap,.kbox,.setrow,.sheet,.tabbar,.week7,.rmres,.exl,[data-noswipe]';
let tx=null;
document.addEventListener('touchstart', e=>{ if(e.touches.length!==1 || !S.role || $('#sheet')) { tx=null; return; } const t=e.target; if(!t.closest || !t.closest('main.wrap') || t.closest(NO_SWIPE)){ tx=null; return; }
  tx={x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now()}; }, {passive:true});
document.addEventListener('touchend', e=>{ if(!tx) return; const c=e.changedTouches[0], dx=c.clientX-tx.x, dy=c.clientY-tx.y, dt=Date.now()-tx.t; tx=null;
  if(Math.abs(dx)<70 || Math.abs(dy)>Math.abs(dx)*0.6 || dt>700) return;
  const tabs=[...document.querySelectorAll('.tabbar .tab')].map(b=>{ const m=/go\('([a-z]+)'/.exec(b.getAttribute('onclick')||''); return m && m[1]; }).filter(k=>k && k!=='nueva');
  const cur = S.role==='pat' ? S.patTab : (S.proTab==='persona'||S.proTab==='evaluar'||S.proTab==='informe' ? 'personas' : S.proTab);
  const i=tabs.indexOf(cur); if(i<0) return; const j=i+(dx<0?1:-1); if(j<0 || j>=tabs.length) return;
  if(S.role==='pat') go(tabs[j]); else pgo(tabs[j]);
  const m=$('main.wrap'); if(m){ m.classList.remove('fade'); m.classList.add(dx<0?'swl':'swr'); }
  try{ navigator.vibrate && navigator.vibrate(8); }catch(x){} }, {passive:true});

/* Las notificaciones se muestran a través del service worker: así aparecen en la barra de notificaciones de Android
   (new Notification() no funciona en Android) y en iPhone cuando la app está instalada en la pantalla de inicio. */
async function notificar(title, body, opt={}){
  try{ if(!('Notification' in window) || Notification.permission!=='granted') return false;
    const o={body, icon:'icons/icon-192.png', badge:'icons/icon-192.png', vibrate:opt.vibrate||[180,80,180], tag:opt.tag||('sm'+Date.now()), renotify:!!opt.tag, requireInteraction:!!opt.fijo, data:{tab:opt.tab||'hoy', url:location.href.split('#')[0], tipo:opt.tipo||''}};
    if(opt.acciones) o.actions=opt.acciones;
    if('serviceWorker' in navigator){ const reg=await Promise.race([navigator.serviceWorker.ready, new Promise(r=>setTimeout(()=>r(null),1500))]); if(reg && reg.showNotification){ await reg.showNotification(title, o); return true; } }
    new Notification(title, o); return true; }catch(e){ console.warn('notificación', e); return false; } }
window.notificar = notificar;
/* ---- avisos con la app cerrada (Web Push): el servidor (/api/push) verifica la sesión de Firebase antes de enviar ---- */
const PUSH_API='https://strongmed.vercel.app/api/push';
async function tokenSM(){ try{ const u=S.auth && S.auth.sm && S.auth.sm.currentUser; return u ? await u.getIdToken() : null; }catch(e){ return null; } }
async function cabAuth(){ const t=await tokenSM(); return {'content-type':'application/json', ...(t?{authorization:'Bearer '+t}:{})}; }
async function apiPush(body){ const t=await tokenSM(); if(!t) return null; try{ const r=await fetch(PUSH_API, {method:'POST', headers:{'content-type':'application/json', authorization:'Bearer '+t}, body:JSON.stringify(body)}); return r.ok ? await r.json() : null; }catch(e){ return null; } }
const b64u = s => { const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b, c=>c.charCodeAt(0)); };
const pushNativo = () => window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications || null;
let fcmListo=false;
async function suscribirFCM(PN){ try{ let st=await PN.checkPermissions(); if(st.receive!=='granted') st=await PN.requestPermissions(); if(st.receive!=='granted') return false;
  if(!fcmListo){ fcmListo=true;
    PN.addListener('registration', t=>{ try{ localStorage.setItem('sm_fcm', t.value); }catch(e){} apiPush({accion:'sub', fcm:t.value}); });
    PN.addListener('pushNotificationActionPerformed', a=>{ const d=(a && a.notification && a.notification.data) || {}; if(S.role==='pat' && d.tab) go(d.tab); else if(S.role==='pro' && d.tab) pgo(d.tab); });
    PN.addListener('pushNotificationReceived', n=>{ if(n && (n.title||n.body)) toast(`${n.title||''}${n.body?' · '+n.body:''}`); }); }
  await PN.register(); return true; }catch(e){ console.warn('fcm', e); return false; } }
async function suscribirPush(){ try{
  const PN=pushNativo(); if(PN) return S.role ? await suscribirFCM(PN) : false;
  if(!S.role || !('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window) || Notification.permission!=='granted') return false;
  const reg=await navigator.serviceWorker.ready; let sub=await reg.pushManager.getSubscription();
  if(!sub){ const r=await fetch(PUSH_API); if(!r.ok) return false; const j=await r.json(); sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(j.publicKey)}); }
  return !!(await apiPush({accion:'sub', sub:sub.toJSON()})); }catch(e){ console.warn('push', e); return false; } }
window.suscribirPush = suscribirPush;
async function quitarPush(){ try{ const PN=pushNativo(); if(PN){ let tk=null; try{ tk=localStorage.getItem('sm_fcm'); }catch(e){} if(tk) await apiPush({accion:'quitar', endpoint:tk}); try{ await PN.unregister(); }catch(e){} return; }
  if(!('serviceWorker' in navigator)) return; const reg=await Promise.race([navigator.serviceWorker.ready, new Promise(r=>setTimeout(()=>r(null),1000))]); const s=reg && reg.pushManager && await reg.pushManager.getSubscription(); if(s){ await apiPush({accion:'quitar', endpoint:s.endpoint}); await s.unsubscribe(); } }catch(e){} }
function avisarPush(a, title, body, tab, tag){ if(!a || !S.role) return; apiPush({accion:'enviar', a, title, body, tab, tag}); }
const TIT_AVISO = {rutina:'Tienes una rutina nueva', cita:'Novedades en tu agenda', tarea:'Tienes una tarea nueva', evaluacion:'Nueva evaluación', video:'Videollamada'};
function pushMsg(p, m){ try{ if(S.role==='pro') avisarPush({rut:normRut(p.rut)}, `Mensaje de ${S.pro.nombre}`, m.tipo==='cita' ? (m.titulo||'Novedades en tu agenda') : 'Tienes un mensaje nuevo', m.tipo==='cita'?'agenda':'chat', m.tipo==='cita'?'cita-'+m.citaId:'chat');
  else { const h=miHilo(p); if(h) avisarPush({pro:h}, `Mensaje de ${first(p.nombre)}`, 'Tienes un mensaje nuevo', 'mensajes', 'chat-'+normRut(p.rut)); } }catch(e){} }

  if(!('Notification' in window)){ toast(isIOS() && !isStandalone() ? 'En iPhone primero instala la app (Compartir → Agregar a inicio) para recibir notificaciones' : 'Este navegador no permite notificaciones','err'); return; }
  const r=await Notification.requestPermission(); if(r==='granted'){ toast('Notificaciones activadas'); suscribirPush(); notificar('StrongMed', 'Listo: aquí te avisaremos de tus sesiones, rutinas, mensajes y videollamadas.'); } else toast('No se activaron. Puedes activarlas en los ajustes del navegador.','err'); render(); }

let chatNotiUnsub=null;
function vigilarChat(){ if(chatNotiUnsub){ try{ chatNotiUnsub(); }catch(e){} chatNotiUnsub=null; } const p=me(); if(!p || !S.fb) return;
  const F=S.fb, key='sm_chatvisto_'+keyOf(p); let visto=+localStorage.getItem(key)||Date.now(); try{ localStorage.setItem(key, visto); }catch(e){}
  try{ const Q=F.limit ? F.query(chatColl(p), F.orderBy('timestamp','desc'), F.limit(1)) : F.query(chatColl(p), F.orderBy('timestamp','asc'));
    chatNotiUnsub=F.onSnapshot(Q, snap=>{ let ult=null; snap.forEach(d=>{ const m=d.data(); if(!ult || (m.timestamp||0)>(ult.timestamp||0)) ult=m; });

/* ---- timbre de videollamada ---- */
let timbre=null;
const ctxAudio = () => { if(!S.audio){ try{ S.audio=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ S.audio=null; } } return S.audio; };
['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev, ()=>{ const a=ctxAudio(); if(a && a.state==='suspended') a.resume(); }, {passive:true}));
function tono(a, t0){ // tono de llamada clásico: 440 + 480 Hz, dos pulsos
  [[0,0.9],[1.2,0.9]].forEach(([d,len])=>{ [440,480].forEach(f=>{ const o=a.createOscillator(), g=a.createGain(); o.frequency.value=f; o.type='sine';
    g.gain.setValueAtTime(0,t0+d); g.gain.linearRampToValueAtTime(0.18,t0+d+0.03); g.gain.setValueAtTime(0.18,t0+d+len-0.05); g.gain.linearRampToValueAtTime(0,t0+d+len);
    o.connect(g).connect(a.destination); o.start(t0+d); o.stop(t0+d+len+0.02); }); }); }
function sonarTimbre(){ pararTimbre(); const a=ctxAudio(); let n=0;
  const paso=()=>{ if(n++>15){ pararTimbre(); return; } if(a){ if(a.state==='suspended') a.resume(); tono(a, a.currentTime+0.05); } try{ navigator.vibrate && navigator.vibrate([700,300,700]); }catch(e){} };
  paso(); timbre=setInterval(paso, 3600); }
function pararTimbre(){ if(timbre){ clearInterval(timbre); timbre=null; } try{ navigator.vibrate && navigator.vibrate(0); }catch(e){} }
const llamadaKey = p => 'sm_llamada_'+keyOf(p);
function checkLlamada(){ const p=me(); if(!p) return; const v=p.videoActiva, on=videoOn(p);
  if(!on){ if($('#llamada')){ $('#llamada').remove(); pararTimbre(); } return; }
  let vista=''; try{ vista=localStorage.getItem(llamadaKey(p))||''; }catch(e){}
  if(vista===String(v.ts) || Date.now()-v.ts > 5*60e3) return;          // ya contestada/rechazada o hace más de 5 minutos
  if($('#llamada')) return;
  const d=document.createElement('div'); d.id='llamada'; d.className='llamada';
  d.innerHTML=`<div class="ll-in"><div class="ll-ring">${avatar({nombre:v.pro||'Kine'},96)}</div><div class="eyebrow" style="margin-top:22px">Videollamada entrante</div><h2 class="disp h2" style="margin-top:6px">${esc(v.pro||'Tu profesional')}</h2><p class="muted sm" style="margin-top:6px">StrongMed · Kin At Home</p>
    <div class="ll-btns"><button class="ll-b no" onclick="rechazarLlamada()" aria-label="Rechazar">${ic('x')}</button><button class="ll-b si" onclick="contestarLlamada()" aria-label="Contestar">${ic('video')}</button></div>
    <div class="row" style="justify-content:space-around;width:100%;max-width:280px" ><span class="xs muted">Rechazar</span><span class="xs muted">Contestar</span></div></div>`;
  document.body.appendChild(d); sonarTimbre();
  notificar('Videollamada entrante', `${v.pro||'Tu profesional'} te está llamando`, {tag:'llamada', fijo:true, tipo:'llamada', vibrate:[700,300,700,300,700], acciones:[{action:'contestar', title:'Contestar'},{action:'rechazar', title:'Rechazar'}]});
  setTimeout(()=>{ if($('#llamada')){ pararTimbre(); } }, 60000); }
window.contestarLlamada = () => { const p=me(); pararTimbre(); $('#llamada')?.remove(); if(!p||!p.videoActiva) return; try{ localStorage.setItem(llamadaKey(p), String(p.videoActiva.ts)); }catch(e){}
  cerrarNotiLlamada(); window.open(p.videoActiva.url, '_blank', 'noopener'); };
window.rechazarLlamada = () => { const p=me(); pararTimbre(); $('#llamada')?.remove(); if(!p||!p.videoActiva) return; try{ localStorage.setItem(llamadaKey(p), String(p.videoActiva.ts)); }catch(e){} cerrarNotiLlamada(); toast('Llamada rechazada. Puedes escribirle por Mensajes.'); };
async function cerrarNotiLlamada(){ try{ const reg=await navigator.serviceWorker?.ready; const ns=await reg?.getNotifications({tag:'llamada'}); (ns||[]).forEach(n=>n.close()); }catch(e){} }

function waNum(tel){ let d=String(tel||'').replace(/\D/g,''); if(!d) return ''; if(d.startsWith('56')) return d; if(d.length===9 && d[0]==='9') return '56'+d; if(d.length===8) return '569'+d; return d; }
const waLink = (tel, txt) => { const n=waNum(tel); return n ? `https://wa.me/${n}?text=${encodeURIComponent(txt)}` : ''; };
function waTexto(p, c, tipo){ const n=first(p.nombre), pro=(S.pro&&S.pro.nombre)||c?.pro||'', lug=c?`${lugarLabel(c)}${c.direccion?` (${c.direccion})`:''}`:'', cuando=c?`${fmtLong(parseISO(toISO(c.fecha)))}${c.hora?` a las ${c.hora}`:''}`:'';

function recordatoriosHTML(){ const td=todayISO(), m=new Date(); m.setDate(m.getDate()+1); const mn=iso(m);
  const cs=allCitas().filter(x=>x.c.estado==='confirmada' && [td,mn].includes(toISO(x.c.fecha))).sort((a,b)=>String(toISO(a.c.fecha)+a.c.hora).localeCompare(String(toISO(b.c.fecha)+b.c.hora)));
  if(!cs.length) return ''; const pend=cs.filter(x=>!x.c.recordado).length;
  return `<div class="sec-t"><h2>Recordar citas (hoy y mañana)</h2><span class="badge ${pend?'acc':''}">${pend} por recordar</span></div><div class="list">${cs.map(({c,p})=>`<div class="li"><div class="tbig" style="min-width:52px">${esc(c.hora||'—')}</div><div class="grow"><div class="b sm">${esc(p.nombre)}</div><div class="xs muted">${toISO(c.fecha)===td?'Hoy':'Mañana'} · ${esc(c.tipo||'')} · ${esc(lugarLabel(c))}${c.recordado?` · <span class="acc-t b">recordada ✓</span>`:''}</div></div><button class="btn ${c.recordado?'sec':'pri'} sm" onclick="recordarCita(${q(keyOf(p))},${q(c.id)})">${ic('phone','s')} ${c.recordado?'Otra vez':'Recordar'}</button></div>`).join('')}</div>`; }
function waBtn(p, c, tipo, cls='btn sec sm', label='WhatsApp'){ const l=waLink(p.contacto, waTexto(p,c,tipo)); return l ? `<a class="${cls}" href="${l}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${ic('phone','s')} ${label}</a>` : ''; }

/* ================= SESIÓN Y ARRANQUE ================= */
const _origRender = render;
function saveSession(){ try{ if(S.role==='pat' && S.me) localStorage.setItem('sm_session', JSON.stringify({role:'pat', key:S.me}));
  else if(S.role==='pro' && S.pro) localStorage.setItem('sm_session', JSON.stringify({role:'pro', id:S.pro.id, usuario:S.pro.usuario}));
  else localStorage.removeItem('sm_session'); }catch(e){} }
window.render = render = function(){ saveSession(); _origRender(); };
async function boot(){
  applyTheme(); netBanner(); document.head.insertAdjacentHTML('beforeend', `<style>${INF_CSS}</style>`);
  let s=null; try{ s=JSON.parse(localStorage.getItem('sm_session')); }catch(e){}
  if(!s){ render(); initFB(); return; }
  $('#app').innerHTML = `<div class="login"><div class="login-in center"><div class="row" style="justify-content:center;gap:8px">${logoSM('l')}${logoKAH('l')}</div><p class="muted sm" style="margin-top:14px">Cargando…</p></div></div>`;
  if(!(await initFB())){ if(!navigator.onLine){ $('#app').innerHTML=`<div class="login"><div class="login-in center stack"><div class="row" style="justify-content:center;gap:8px">${logoSM('l')}${logoKAH('l')}</div><p class="muted sm">Sin conexión. Conéctate a internet una vez para terminar de instalar la app.</p><button class="btn pri" onclick="location.reload()">Reintentar</button></div></div>`; return; } localStorage.removeItem('sm_session'); render(); return; }
  try{
    if(s.role==='pat'){ const rut=splitKey(s.key).rut; if(await loadPersona(rut,'cache') && prof(s.key)){ S.role='pat'; S.me=s.key; S.patTab='hoy'; S._lastSync=Date.now(); afterPatLogin(); return; }
      await loadPersona(rut); if(prof(s.key)){ S.role='pat'; S.me=s.key; S.patTab='hoy'; afterPatLogin(); return; } }
    if(s.role==='pro' && s.usuario){ const u=proUser(s.usuario), cu=S.auth?.sm?.currentUser;
      if(!cu || String(cu.email||'').startsWith(u+'.')){ const acc=(await accesoDeCache('sm', u)) || (await accesoDe('sm', u)); if(acc && acc.activo!==false){ await iniciarPro(acc, true); return; } } }
  }catch(e){ console.error(e); }
  localStorage.removeItem('sm_session'); S.role=null; render();
}
boot();
window.__t = {save, tareas, storyBlob, checkLlamada, notificar, vigilarChat, USO, diaPT, msHastaRenovar, people, prof, evalsOf, me, loadLib, libFind, keyOf, agendaOf, freeSlots};
